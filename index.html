    const t = this.tutorial, m = this.match; if (!t || !m) return;
    let advanced = false;
    if (t.step === 0 && res.thrown && res.mode === 'lob') advanced = true;
    else if (t.step === 1 && res.thrown && res.mode === 'bullet') advanced = true;
    else if (t.step === 2 && res.runPlay) advanced = true;
    else if (t.step === 3 && res.type === 'kick') advanced = true;
    if (advanced) { t.step++; UI.toast(t.step >= 4 ? 'TUTORIAL COMPLETE' : 'NICE. NEXT STEP', 1400); }
    else UI.toast(t.step === 2 ? 'HAND IT OFF TO THE RUNNING BACK' : t.step === 3 ? 'TRY THE KICK AGAIN' : 'TRY THAT THROW AGAIN', 1400);
    if (t.step >= 4) {
      $('tip').hidden = true;
      UI.panel(() => h('div', { class: 'card choice' }, h('h2', null, 'YOU ARE READY'), h('p', { class: 'note' }, 'Lobs float over linebackers. Bullets beat closing corners. Run when the box is light, and kick when the drive stalls.'),
        h('div', { class: 'choice-btns' }, h('button', { class: 'btn primary big', onclick: () => { UI.hidePanel(); this.tutorial = null; this.quit(); this.quickPlay(); } }, 'PLAY A GAME'), h('button', { class: 'btn big', onclick: () => { UI.hidePanel(); this.tutorial = null; this.quit(); UI.newCareer(); } }, 'START FRANCHISE'))), 'center');
      return;
    }
    this.showTip();
    setTimeout(() => {
      if (!this.match) return;
      if (t.step === 3) { m.los = 75; m.down = 4; m.toGo = 3; m.state = 'meter'; m.startMeter('fg'); }
      else this.drillSnap(true);
    }, 900);
  },
  // ---------- franchise ----------
  newFranchise(coach, teamId, slot = LG.slot) {
    const L = LG.create({ coach, teamId, seed: (Math.random() * 1e9) | 0 });
    LG.setSlot(slot); L.slot = slot;
    LG.save(L);
    this.league = L;
    UI.hub('home');
    UI.toast(`Welcome to ${L.teams[teamId].city}, ${coach}`);
  },
  openFranchise() { this.league = LG.load(); if (!this.league) { UI.title(); return; } UI.hub('home'); },
  playFranchiseGame(gameRef, sim) {
    const L = this.league, S = Settings.get();
    const home = gameRef.h === L.teamId, opp = L.teams[home ? gameRef.a : gameRef.h], me = LG.userTeam(L);
    const rng = LG.rng(L), seed = rng.int(1, 1e9);
    const tab = LG.table(L)[L.teamId];
    const winPct = tab.w / Math.max(1, tab.w + tab.l);
    if (!opp.roster) aiStars(opp, rng);
    const m = new Match(Object.assign(this.baseCfg(), {
      seed, userTeam: me, oppTeam: opp, userHome: home || (gameRef.playoff && gameRef.h === L.teamId),
      userLineup: buildLineup(L.roster, seed), oppLineup: opp.roster ? buildLineup(opp.roster, seed + 1, 'orep') : aiLineup(opp, seed), oppRatings: { off: opp.off, def: opp.def, kick: opp.kick },
      weather: rollWeather(rng, (home ? me : opp).abbr, gameRef.playoff ? 17 : L.week, S.weather),
      dcLevel: L.staff.dc, ocLevel: L.staff.oc, dynamicBias: (winPct - 0.5) * 0.15 + (L.year - 1) * 0.01,
      onEnd: (mm) => this.franchiseGameOver(mm, gameRef),
    }));
    // condition and stamina carry into the game
    for (const p of L.roster) if (m.stamina[p.id] != null) m.stamina[p.id] = clamp(p.cond / 100, 0.5, 1);
    if (sim) { m.simMode = true; UI.simFast = false; }
    this.launch(m);
  },
  franchiseGameOver(m, gameRef) {
    const L = this.league;
    const summary = LG.finishUserGame(L, m, gameRef);
    if (L.phase === 'regular') LG.advanceWeek(L);
    else if (L.phase === 'playoffs') { LG.advanceWeek(L); LG.advancePlayoffs(L); }
    LG.save(L);
    UI.final(m, summary, () => { this.leaveMatch(); UI.hub('home'); });
  },
  leaveMatch() {
    this.match = null; this.replay = null; this.paused = false; this.endAim();
    UI.hidePanel(); UI.hidePause(); UI.hint(''); $('tip').hidden = true; UI.refresh(); this.updateRotate();
    Sound.crowd(0);
  },
  quit(fromPause) {
    const m = this.match;
    if (fromPause && m && this.league && !m.drill && !m.over) {
      // finish the game by simulation so the result counts
      this.paused = false; m.paused = false; UI.hidePause(); this.endAim();
      UI.simFast = true; m.forceSim();
      return;
    }
    const wasLeague = !!this.league && m && !m.drill;
    this.leaveMatch();
    if (wasLeague) UI.hub('home'); else UI.title();
  },
};

window.addEventListener('DOMContentLoaded', () => Game.init());

</script>
