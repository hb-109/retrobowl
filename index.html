/* Layout: full-bleed canvas field; DOM menus float over it in chunky scoreboard panels. */
:root {
  --night: #0b1020;      /* stadium night sky */
  --panel: #141c33;      /* scoreboard housing */
  --panel-2: #1e2949;
  --chalk: #f3efe2;      /* yard-line white */
  --muted: #9aa6c4;
  --marker: #ffd23f;     /* first-down line */
  --flag: #ff9d3c;       /* bullet / caution */
  --red: #ff5a4f;
  --turf: #3a9640;
  --good: #7dff8a;
  --f-pix: 'TB Pixel', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --f-body: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hud: 52px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--chalk); }
body { font-family: var(--f-body); font-size: 15px; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }
#safe-probe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- pixel buttons ---------- */
.btn { font-family: var(--f-pix); font-size: 16px; line-height: 1; letter-spacing: 0; text-transform: uppercase; min-height: 48px; min-width: 48px; padding: 12px 16px; background: var(--panel-2); color: var(--chalk); border: 2px solid #33406a; border-radius: 0; box-shadow: 0 4px 0 #070a14; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: transform .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #070a14; }
.btn small { font-family: var(--f-body); font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: .02em; }
.btn.primary { background: var(--marker); color: #141009; border-color: #fff1a8; }
.btn.primary small { color: #4a3d10; }
.btn.danger { background: #3a1820; border-color: #7a2f3a; color: #ffb3ab; }
.btn.big { min-height: 56px; font-size: 16px; padding: 14px 18px; }
.btn.small { min-height: 44px; padding: 8px 12px; font-size: 16px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }

/* ---------- game HUD buttons ---------- */
#hudbtns { position: absolute; inset: 0; pointer-events: none; }
.hb { pointer-events: auto; font-family: var(--f-pix); font-size: 16px; min-width: 48px; min-height: 44px; padding: 0 12px; background: rgba(11,16,32,.86); border: 2px solid #33406a; color: var(--chalk); box-shadow: 0 3px 0 #05070e; }
.hb:disabled { opacity: .4; }
.hb-pause { position: absolute; top: calc(env(safe-area-inset-top, 0px) + (var(--hud) - 44px) / 2); left: calc(env(safe-area-inset-left, 0px) + 8px); width: 48px; height: 44px; padding: 0; background: transparent; border-color: #2a3558; box-shadow: none; }
.hb-group { position: absolute; top: calc(var(--hud) + env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); display: flex; gap: 8px; }
.hb-low { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 10px); display: flex; gap: 8px; }
body.lefty .hb-group, body.lefty .hb-low { right: auto; left: calc(env(safe-area-inset-left, 0px) + 10px); }
body.lefty .hb-pause { left: auto; right: calc(env(safe-area-inset-right, 0px) + 8px); }
body.aiming #hudbtns .hb { pointer-events: none; opacity: .35; }
#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: min(92vw, 860px); font-family: var(--f-pix); font-size: 16px; line-height: 1.5; text-align: center; color: var(--chalk); text-shadow: 2px 2px 0 #000; pointer-events: none; }
#tip { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--hud) + env(safe-area-inset-top, 0px) + 10px); width: min(560px, calc(100vw - 32px)); background: rgba(11,16,32,.92); border: 2px solid var(--marker); padding: 12px 16px; display: grid; gap: 6px; pointer-events: none; }
#tip b { font-family: var(--f-pix); font-size: 16px; color: var(--marker); }
#tip span { font-size: 15px; line-height: 1.45; text-wrap: pretty; }
#toast { position: absolute; left: 50%; top: calc(var(--hud) + env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); background: var(--chalk); color: #10131c; font-family: var(--f-pix); font-size: 16px; padding: 10px 14px; max-width: calc(100vw - 32px); text-align: center; z-index: 60; pointer-events: none; box-shadow: 0 4px 0 #000; }
#toast.show { animation: pop .18s ease-out; }
body.menu #toast { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
@keyframes pop { from { transform: translateX(-50%) scale(.85); } to { transform: translateX(-50%) scale(1); } }
#rotate { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); text-align: center; font-family: var(--f-pix); font-size: 16px; color: var(--marker); pointer-events: none; text-shadow: 2px 2px 0 #000; }

/* ---------- in-game panels ---------- */
#panel { position: absolute; inset: 0; z-index: 30; display: flex; pointer-events: none; padding: calc(var(--hud) + env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }
#panel.center { align-items: center; justify-content: center; background: rgba(6,9,18,.42); pointer-events: auto; }
#panel.bottom { align-items: flex-end; justify-content: center; }
#panel > .card { pointer-events: auto; }
.card { background: var(--panel); border: 2px solid #2a3558; box-shadow: 0 6px 0 rgba(0,0,0,.45); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card h2 { font-family: var(--f-pix); font-size: 16px; margin: 0; color: var(--marker); letter-spacing: .02em; text-wrap: balance; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 { font-family: var(--f-pix); font-size: 16px; margin: 0; color: var(--chalk); }
.card p { margin: 0; line-height: 1.45; text-wrap: pretty; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 14px; }
.playbook { width: min(860px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; }
.pb-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.pb-group { display: grid; gap: 8px; align-content: start; }

const sign = (v) => (v < 0 ? -1 : 1);
const approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class RNG {
  constructor(seed) { this.seed = (seed >>> 0) || 1; this.f = mulberry32(this.seed); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  normal(mean = 0, sd = 1) {
    let u = 0, v = 0;
    while (u === 0) u = this.f();
    while (v === 0) v = this.f();
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  weighted(items, wfn) {
    let total = 0; for (const it of items) total += Math.max(0, wfn(it));
    let r = this.f() * total;
    for (const it of items) { r -= Math.max(0, wfn(it)); if (r <= 0) return it; }
    return items[items.length - 1];
  }
}

function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function ordinal(n) { return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'); }
// spot is yards from the offense's own goal line (0..100)
function spotText(spot, ownAbbr, oppAbbr) {
  const s = Math.round(spot);
  if (s === 50) return '50';
  if (s < 50) return (ownAbbr || 'OWN') + ' ' + Math.max(1, s);
  return (oppAbbr || 'OPP') + ' ' + Math.max(1, 100 - s);
}
function downText(down, toGo, spot) {
  const goal = spot + toGo >= 100 - 0.01;
  const tg = goal ? 'GOAL' : (toGo < 1 ? 'INCHES' : Math.round(toGo));
  return ordinal(down).toUpperCase() + ' & ' + tg;
}
function money(m) { return '$' + (Math.round(m * 10) / 10).toFixed(1) + 'M'; }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function colorDist(a, b) { const x = hexToRgb(a), y = hexToRgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); }
function shade(hex, f) { const c = hexToRgb(hex).map(v => clamp(Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f), 0, 255)); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); }
function luminance(hex) { const [r, g, b] = hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

// ---------- bitmap font for crisp canvas lettering ----------
const PixFont = {
  glyphs: {}, atlases: {}, order: [],
  init() {
    for (const ch in FONT_GLYPHS) {
      this.glyphs[ch] = FONT_GLYPHS[ch].split(' ').map(r => r.split('').map(c => c === '1'));
      this.order.push(ch);
    }
  },
  atlas(color) {
    if (this.atlases[color]) return this.atlases[color];
    const c = document.createElement('canvas');
    c.width = this.order.length * 6; c.height = 7;
    const g = c.getContext('2d');
    g.fillStyle = color;
    const index = {};
    this.order.forEach((ch, i) => {
      index[ch] = i;
      const rows = this.glyphs[ch];
      for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) if (rows[r][k]) g.fillRect(i * 6 + k, r, 1, 1);
    });
    return (this.atlases[color] = { c, index });
  },
  width(text, px) { return Math.max(0, text.length * 6 - 1) * px; },
  // draws text with its top-left at (x,y); px = device pixels per font pixel
  draw(ctx, text, x, y, px, color, align = 'left', shadow = null) {
    text = String(text).toUpperCase();
    const w = this.width(text, px);
    if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
    x = Math.round(x); y = Math.round(y);
    if (shadow) this._run(ctx, text, x + px, y + px, px, shadow);
    this._run(ctx, text, x, y, px, color);
    return w;
  },
  _run(ctx, text, x, y, px, color) {
    const a = this.atlas(color);
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < text.length; i++) {
      const gi = a.index[text[i]];
      if (gi !== undefined && text[i] !== ' ') ctx.drawImage(a.c, gi * 6, 0, 5, 7, x + i * 6 * px, y, 5 * px, 7 * px);
    }
    ctx.imageSmoothingEnabled = prev;
  },
};

// ---------- synthesized sound: crowd bed, whistles, thuds, jingles ----------
const Sound = {
  ctx: null, master: null, crowdGain: null, noise: null, on: true, started: false,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.on ? 0.7 : 0;
      this.master.connect(this.ctx.destination);
      const sr = this.ctx.sampleRate, len = sr * 2;
      const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) { // pinkish noise
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0526;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
      }
      this.noise = buf;
    } catch (e) { this.ctx = null; }
  },
  unlock() {
    this.init();
    if (!this.ctx) return;
    const go = () => { if (typeof Music !== 'undefined' && Music.want && !Music.playing) Music.play(Music.want); };
    if (this.ctx.state === 'suspended') { const p = this.ctx.resume(); if (p && p.then) p.then(go, () => { }); } else go();
    if (!this.started) this.startCrowd();
  },
  setEnabled(on) {
    this.on = on;
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.7 : 0, this.ctx.currentTime, 0.05);
    if (typeof Music !== 'undefined') { if (!on) Music.pause(); else if (Music.want) Music.play(Music.want); }
  },
  startCrowd() {
    if (!this.ctx || this.started) return;
    this.started = true;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
    this.crowdGain = this.ctx.createGain(); this.crowdGain.gain.value = 0;
    src.connect(bp); bp.connect(this.crowdGain); this.crowdGain.connect(this.master);
    src.start();
  },
  crowd(level) { // 0..1
    if (!this.crowdGain) return;
    this.crowdGain.gain.setTargetAtTime(0.05 + level * 0.35, this.ctx.currentTime, 0.4);
  },
  _env(node, t, a, peak, d) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(peak, t + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  tone(freq, dur, type = 'square', vol = 0.12, when = 0) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    this._env(g, t, 0.01, vol, dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  whistle(long = false) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime, dur = long ? 0.7 : 0.32;
    const o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.value = 2850; lfo.frequency.value = 34; lg.gain.value = 180;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.setValueAtTime(0.16, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
  },
  burst(freq, q, dur, vol) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); this._env(g, t, Math.min(0.15, dur * 0.2), vol, dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.1);
  },
  thud() {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
    this._env(g, t, 0.005, 0.35, 0.18); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.25);
    this.burst(400, 1, 0.08, 0.2);
  },
  kick() { this.thud(); this.tone(220, 0.06, 'triangle', 0.15); },
  snap() { this.tone(160, 0.05, 'square', 0.06); },
  throwSnd() { this.burst(1800, 2, 0.12, 0.08); },
  catchSnd() { this.tone(523, 0.05, 'square', 0.07); this.tone(784, 0.07, 'square', 0.07, 0.05); },
  blip() { this.tone(880, 0.04, 'square', 0.05); },
  cheer(big = true) { this.burst(1100, 0.5, big ? 2.6 : 1.4, big ? 0.55 : 0.3); },
  groan() { this.burst(300, 0.8, 1.2, 0.3); },
  jingle(kind) {
    const seqs = {
      td: [[523, 0], [659, 0.12], [784, 0.24], [1046, 0.36], [784, 0.52], [1046, 0.64]],
      fg: [[392, 0], [523, 0.12], [659, 0.24]],
      bad: [[330, 0], [262, 0.18]],
      win: [[523, 0], [659, 0.15], [784, 0.3], [1046, 0.45], [1318, 0.7]],
    };
    for (const [f, w] of (seqs[kind] || [])) this.tone(f, 0.16, 'square', 0.09, w);
  },
};

// ---------- menu music: a small original chiptune loop (square lead, triangle bass, noise drums) ----------
const Music = {
  on: true, want: null, playing: null, timer: null, step: 0, nextT: 0, gain: null,
  // one step = an eighth note; each bar is 8 steps. Notes are MIDI numbers, 0 = rest, -1 = hold
  tracks: {
    menu: {
      bpm: 138,
      lead: [
        74, 71, 67, 71, 74, -1, 79, -1,   78, 76, 74, 76, 78, -1, 74, -1,
        76, 72, 69, 72, 76, -1, 81, -1,   79, 78, 76, 78, 74, -1, -1, -1,
        71, 74, 79, 74, 72, 76, 81, 76,   71, 74, 79, 83, 81, -1, 79, -1,
        76, 79, 78, 76, 74, 72, 71, 69,   67, -1, 71, 74, 79, -1, -1, 0,
      ],
      bass: [43, 43, 50, 50, 45, 50, 43, 43], // one root per bar
      chord: [[67, 71, 74], [66, 69, 74], [69, 72, 76], [66, 69, 74], [67, 71, 74], [67, 71, 74], [64, 67, 72], [67, 71, 74]],
    },
  },
  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  setEnabled(on) { this.on = on; if (!on) this.stop(); else if (this.want) this.play(this.want); },
  play(name) {
    this.want = name;
    if (!this.on || !Sound.ctx || !Sound.on || Sound.ctx.state !== 'running') return;
    if (this.playing === name) return;
    this.stop(true);
    const ctx = Sound.ctx;
    this.gain = ctx.createGain(); this.gain.gain.value = 0.0001; this.gain.connect(Sound.master);
    this.gain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.8);
    this.playing = name; this.step = 0; this.nextT = ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.pump(), 60);
  },
  stop(quick) {
    if (this.timer) clearInterval(this.timer);
    this.timer = null; this.playing = null;
    if (this.gain && Sound.ctx) { const g = this.gain; g.gain.setTargetAtTime(0.0001, Sound.ctx.currentTime, quick ? 0.03 : 0.25); setTimeout(() => { try { g.disconnect(); } catch (e) { } }, 1500); }
    this.gain = null;
  },
  pause() { const w = this.want; this.stop(true); this.want = w; },
  pump() {
    const ctx = Sound.ctx, tr = this.tracks[this.playing];
    if (!ctx || !tr || !this.gain) return;
    const dt = 60 / tr.bpm / 2;
    while (this.nextT < ctx.currentTime + 0.25) {
      const i = this.step % tr.lead.length, bar = Math.floor(i / 8) % tr.bass.length, beat = i % 8, t = this.nextT;
      // lead: hold notes extend through -1 steps
      const n = tr.lead[i];
      if (n > 0) { let len = 1; while (tr.lead[(i + len) % tr.lead.length] === -1 && len < 8) len++; this.note(n, t, dt * len * 0.92, 'square', 0.045); }
      // bass: root / octave bounce on eighths
      const root = tr.bass[bar];
      this.note(beat % 2 ? root + 12 : root, t, dt * 0.8, 'triangle', 0.11);
      // soft chord stabs on the off-beats
      if (beat === 2 || beat === 6) for (const c of tr.chord[bar]) this.note(c - 12, t, dt * 0.5, 'square', 0.012);
      // drums
      if (beat === 0 || beat === 4) this.kick(t);
      if (beat === 2 || beat === 6) this.hat(t, 0.06, 0.12, 1800);
      this.hat(t, 0.025, 0.03, 7000);
      this.nextT += dt; this.step++;
    }
  },
  note(n, t, dur, type, vol) {
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(this.freq(n), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.setValueAtTime(vol, t + Math.max(0.01, dur - 0.04)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur + 0.02);
  },
  kick(t) {
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + 0.2);
  },
  hat(t, vol, dur, freq) {
    const ctx = Sound.ctx; if (!Sound.noise) return;
    const s = ctx.createBufferSource(); s.buffer = Sound.noise;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.gain); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
};

function playerOvr(p) {
  const keys = POS_ATTRS[p.pos];
  let s = 0; for (const k of keys) s += p.attrs[k];
  return Math.round(s / keys.length * 10);
}
function starsFromOvr(ovr) { return clamp(Math.round(ovr / 20 * 2) / 2, 0.5, 5); }
function salaryFor(ovr, age) {
  let s = 0.75 + Math.pow(ovr / 100, 3) * 28;
  if (age >= 32) s *= 0.8; else if (age <= 23) s *= 0.9;
  return Math.round(s * 10) / 10;
}
function jerseyNum(rng, pos, taken) {
  const r = NUM_RANGE[pos];
  for (let i = 0; i < 40; i++) {
    const pair = r.length > 2 && rng.chance(0.5) ? [r[2], r[3]] : [r[0], r[1]];
    const n = rng.int(pair[0], pair[1]);
    if (!taken || !taken.has(n)) { if (taken) taken.add(n); return n; }
  }

}
function genName(rng) { return { first: rng.pick(FIRST_NAMES), last: rng.pick(LAST_NAMES) }; }
function blankStats() { return { gp: 0, att: 0, cmp: 0, pyd: 0, ptd: 0, pint: 0, car: 0, ryd: 0, rtd: 0, rec: 0, recyd: 0, rectd: 0, tkl: 0, sck: 0, dint: 0, fgm: 0, fga: 0, xpm: 0, xpa: 0, kryd: 0 }; }

function genPlayer(rng, pos, quality, age, opts = {}) {
  const attrs = {};
  for (const k of POS_ATTRS[pos]) attrs[k] = Math.round(clamp(rng.normal(quality, 1.0), 1, 10) * 10) / 10;
  const youth = clamp((27 - age) / 6, 0, 1);
  const pot = Math.round(clamp(quality + rng.range(0.2, 3.6) * youth + rng.range(-0.3, 0.6), 1, 10) * 10) / 10;
  const nm = genName(rng);
  const p = {
    id: uid('p'), first: nm.first, last: nm.last, pos, age, num: jerseyNum(rng, pos, opts.taken), attrs, pot,
    salary: 0, years: rng.int(1, 4), morale: rng.int(55, 80), cond: 100, inj: null, xp: 0,
    season: blankStats(), career: blankStats(), seasons: [], peak: 0, drafted: opts.drafted || null, joined: opts.year || 1,
    skin: rng.int(0, 4),

  p.ovr = playerOvr(p);
  p.peak = p.ovr;
  p.salary = opts.salary != null ? opts.salary : salaryFor(p.ovr, age);

}
function refreshPlayer(p) { p.ovr = playerOvr(p); p.peak = Math.max(p.peak || 0, p.ovr); return p; }
function shortName(p) { return p ? (p.first[0] + '. ' + p.last) : 'Unknown'; }
// A team's uniform; away team switches to white jerseys if the colours clash.
function uniformFor(team, opponent, isHome) {
  let jersey = team.colors[0], trim = team.colors[1], helmet = team.colors[0], pants = team.colors[1];
  if (luminance(trim) < 0.18 && luminance(jersey) < 0.25) pants = '#d9d9d9';
  if (!isHome && opponent && colorDist(team.colors[0], opponent.colors[0]) < 120) { jersey = '#f4f4f4'; trim = team.colors[0]; pants = team.colors[0]; }
  return { key: team.abbr + jersey + trim, jersey, trim, helmet, pants };
}

function makeTeams(rng) {
  return TEAM_DEFS.map((d, i) => ({
    id: i, abbr: d[0], city: d[1], name: d[2], colors: [d[3], d[4]], conf: d[5], div: d[6],
    off: Math.round(clamp(rng.normal(61, 9), 42, 90)), def: Math.round(clamp(rng.normal(61, 9), 42, 90)), kick: rng.int(4, 9),
    stars: null,
  }));
}
// Named key players for an AI team so play-by-play can mention people, not numbers.
function aiStars(team, rng) {
  if (team.stars) return team.stars;
  const mk = (pos, q) => { const p = genPlayer(rng, pos, q, rng.int(23, 31)); return { name: shortName(p), num: p.num, pos }; };
  const oq = team.off / 10, dq = team.def / 10;
  team.stars = { QB: mk('QB', oq), RB: mk('RB', oq), WR: mk('WR', oq), TE: mk('TE', oq - 1), DL: mk('DL', dq), LB: mk('LB', dq), DB: mk('DB', dq) };
  return team.stars;
}

  else if (form === 'single') { P.QB = { x: L - 1.1, y: B }; P.RB = { x: L - 6.8, y: B }; P.under = true; }
  else if (form === 'iform') { P.QB = { x: L - 1.1, y: B }; P.RB = { x: L - 7.4, y: B }; P.S = { x: L - 4.6, y: B }; P.under = true; }

// Pick a player to credit, weighted by position and rating.
function makeDefCredit(rng, lineup, named) {
  // lineup: array of {name, pid, pos, r}
  const pickBy = (weights) => {
    const pool = lineup.filter(p => weights[p.pos]);

  };

    tackle: (isPass) => pickBy(isPass ? { DB: 3, LB: 2.2, DL: 0.6 } : { LB: 3.2, DL: 2, DB: 1 }),
    sack: () => pickBy({ DL: 3, LB: 1.2, DB: 0.2 }),
    int: () => pickBy({ DB: 3, LB: 1 }),

}
function makeOffCredit(rng, lineup) {

  return { qb: () => pick('QB'), rb: () => pick('RB'), wr: () => pick('WR'), te: () => pick('TE'), k: () => pick('K') };
}

// ---------- lineups ----------
const SLOT_COUNTS = { QB: 1, RB: 1, WR: 3, TE: 1, OL: 5, DL: 4, LB: 2, DB: 5, K: 1 };
const REP_LEVEL = 4.0;
function repPlayer(pos, i, rng, level = REP_LEVEL, prefix = 'rep', taken = null) {
  const attrs = {}; for (const k of POS_ATTRS[pos]) attrs[k] = Math.round(clamp(level + rng.range(-0.5, 0.5), 1, 10) * 10) / 10;
  const nm = genName(rng);

}

  return { pos: pl.pos, pl, name: shortName(pl), num: pl.num, skin: pl.skin || 0, pid: pl.id, stamina, star: !pl.rep, rating: (pl.ovr || 40) / 10 };
}
function buildLineup(roster, seed, prefix = 'rep') {
  const rng = new RNG(seed || 7);
  const L = {}, taken = new Set(roster.map(p => p.num));
  for (const pos of POSITIONS) {
    const avail = roster.filter(p => p.pos === pos && !(p.inj && p.inj.weeks > 0)).sort((a, b) => b.ovr - a.ovr);
    const n = SLOT_COUNTS[pos];
    const arr = [];
    for (let i = 0; i < n; i++) arr.push(avail[i] || repPlayer(pos, i, rng, REP_LEVEL, prefix, taken));
    L[pos] = arr;

}

  const avg = (arr) => arr.reduce((s, p) => s + (p.ovr || playerOvr(p)), 0) / arr.length;
  const off = (avg(L.QB) * 3 + avg(L.RB) + avg(L.WR) * 3 * 0.9 + avg(L.TE) * 0.8 + avg(L.OL) * 2.5) / (3 + 1 + 2.7 + 0.8 + 2.5);
  const def = (avg(L.DL) * 2.6 + avg(L.LB) * 2 + avg(L.DB) * 3.2) / 7.8;
  const k = L.K[0].attrs.kpw * 0.5 + L.K[0].attrs.kac * 0.5;

// a team without a managed roster: generate players around its ratings (seeded so a game is consistent)
function aiLineup(team, seed) {
  const rng = new RNG(seed);
  const roster = [], taken = new Set();
  const lvl = (pos) => (['QB', 'RB', 'WR', 'TE', 'OL'].includes(pos) ? team.off : ['DL', 'LB', 'DB'].includes(pos) ? team.def : team.kick * 10) / 10;
  for (const pos of POSITIONS) for (let i = 0; i < SLOT_COUNTS[pos]; i++) {
    const p = genPlayer(rng, pos, clamp(lvl(pos) - (i > 1 ? 0.4 : 0), 1, 10), rng.int(23, 31), { taken });
    p.id = 'ai:' + team.abbr + ':' + pos + i; roster.push(p);
  }
  if (team.stars) for (const pos in team.stars) { const s = team.stars[pos]; const p = roster.find(r => r.pos === pos); if (p) { const [f, ...l] = s.name.split(' '); p.first = f.replace('.', ''); p.last = l.join(' '); if (!roster.some(r => r !== p && r.num === s.num)) p.num = s.num; } }

const DIFF_BASE = { easy: 0.86, normal: 1.0, hard: 1.14, dynamic: 1.0 };
const WEATHER_KINDS = ['clear', 'rain', 'wind', 'snow'];
function rollWeather(rng, homeAbbr, week, allow = true) {
  if (!allow) return { kind: 'clear', wx: 0, wy: 0 };
  const cold = COLD_CITIES.includes(homeAbbr) && week >= 11;
  const r = rng.next();
  let kind = 'clear';
  if (cold && r < 0.22) kind = 'snow'; else if (r < 0.42) kind = rng.chance(0.55) ? 'rain' : 'wind';
  const w = kind === 'wind' ? rng.range(4, 8) : kind === 'clear' ? rng.range(0, 1.5) : rng.range(1, 4);
  const a = rng.range(0, TAU);
  return { kind, wx: Math.cos(a) * w, wy: Math.sin(a) * w * 0.6 };

  // ---------- start ----------
  start() {

  userKickoff() {

  simKickoffStart() { return this.kickRule === 'modern' ? (this.rng.chance(0.6) ? 35 : this.rng.int(24, 34)) : (this.rng.chance(0.55) ? 25 : this.rng.int(18, 32)); }
  oppKicksOff() {

  startReturn(ret) {

    const blk = [...this.UL.LB, ...this.UL.DB, ...this.UL.TE, ...this.UL.RB, ...this.UL.WR].filter(p => p !== KR).slice(0, 10);

  // ---------- user offense ----------
  // the defense calls a coverage from down, distance, field zone, formation and your tendencies,

  coverageCall() {

    const passRate = (this.tend.pass + 2) / (this.tend.pass + this.tend.run + 4);
    const W = { man2: 1, cover1: 1, cover2: 1, cover3: 1.2, cover4: 0.8, blitz: 0.6, zoneblitz: 0.5 };
    if (this.toGo >= 8) { W.cover2 += 1; W.cover4 += 1; W.cover3 += 0.5; W.blitz -= 0.3; }
    if (this.toGo <= 2) { W.blitz += 1; W.cover1 += 0.8; W.man2 += 0.5; W.cover4 -= 0.5; }
    if (this.los >= 80) { W.man2 += 0.6; W.cover1 += 0.6; W.cover4 -= 0.4; }

  // engine events -> sound, haptics, banners

  }

      case 'drop': this.flash('DROPPED'); break;
      case 'juked': this.flash('JUKED!'); Sound.crowd(0.6); break;
      case 'trucked': this.flash('TRUCKED!'); Sound.thud(); Sound.crowd(0.7); break;
      case 'broken': this.flash('BROKEN TACKLE'); Sound.thud(); break;

  onPlayEnd(res) {

  // ---------- dynamic camera ----------
  camTarget(game) {
    const m = game.match;
    if (!m) { const a = this.attract; return a ? { x: a.camX, y: MID_Y - 2, z: 1.12 } : { x: 50, y: MID_Y, z: 1 }; }
    if (game.replay) { const b = game.replay.ball || { x: m.los, y: MID_Y }; return { x: b.x + 3, y: b.y, z: 1.25 }; }

      const k = m.meter.kind;
      return { x: m.los + (k === 'kickoff' || k === 'onside' ? 10 : k === 'punt' ? 16 : 12), y: MID_Y, z: 1.08 };
    }
    const sim = m.sim;
    if (!sim) return { x: m.poss === 'u' ? m.los : 100 - (m.los || 50), y: MID_Y, z: 1.05 };
    const b = sim.ball;
    if (sim.kind === 'return') {
      if (sim.phase === 'retAir') return { x: lerp(b.x, sim.ret.landX, 0.5) + 6, y: lerp(b.y, sim.ret.landY, 0.5), z: 1.1 };

    if (sim.phase === 'pre') return { x: m.los + 8, y: m.ballY - 5, z: 1.04 };

  updateCamera(game, dt) {

  // ---------- frame ----------

  // ---------- title-screen attract loop: a scripted deep shot behind the menus ----------

      ...[-2.8, -1.4, 0, 1.4, 2.8].map((dy, i) => P(O, 70 + i, i % 5, [...hold(x0 - 0.8, M + dy), [S + 0.6, x0 - 2.2, M + dy * 1.1], [10, x0 - 2.6, M + dy * 1.1]])),

      P(D, 55, 3, [...hold(x0 + 5, M + 3), [2.6, x0 + 9, M + 5], [10, x0 + 15, M + 4]], -1),
      P(D, 24, 0, [...hold(x0 + 6, M - 18.5), [2.4, x0 + 12, M - 18], [3.9, x0 + 27.5, M - 15.8], [7.4, 100, M - 9.2], [10, 100.5, M - 9]], -1),  // corner, a step behind
      P(D, 21, 2, [...hold(x0 + 6, M + 17.5), [2.4, x0 + 11, M + 15], [6, x0 + 28, M + 4], [10, x0 + 33, M + 2]], -1),
      P(D, 31, 4, [...hold(x0 + 15, M - 5), [3, x0 + 20, M - 9], [4.6, x0 + 34, M - 12], [7.6, 98, M - 11], [10, 99, M - 11]], -1),            // safety, too late

  drawAttract(dt) {

      for (let i = 1; i < keys.length; i++) if (tt <= keys[i][0]) { const [t0, x0, y0] = keys[i - 1], [t1, x1, y1] = keys[i]; const k = t1 > t0 ? (tt - t0) / (t1 - t0) : 1; return { x: lerp(x0, x1, k), y: lerp(y0, y1, k) }; }

    let ball, carrier = null;

      const p = at(c.keys, t), p2 = at(c.keys, Math.max(0, t - 0.05));

  },

  // ---------- stadium: stands, crowd, wall ----------
  crowdCanvases(m) {
    const home = m ? (m.userHome ? m.user : m.opp) : { colors: ['#c44b3a', '#f2c14e'], abbr: 'TB' };
    const away = m ? (m.userHome ? m.opp : m.user) : { colors: ['#3a64c4', '#e8e1d2'] };
    const key = home.colors.join() + away.colors.join();
    if (this.crowdFrames && this.crowdKey === key) return this.crowdFrames;
    const W = 860, H = 44, rng = new RNG(1234);
    const fans = [];
    const neutral = ['#e8e1d2', '#3b3f4a', '#6d7486', '#c9c2b1', '#2a2d36'];
    for (let row = 0; row < 10; row++) for (let x = (row % 2); x < W; x += 2) {
      if (rng.chance(0.06)) continue; // empty seat
      const r = rng.next();
      const shirt = r < 0.5 ? home.colors[rng.chance(0.75) ? 0 : 1] : r < 0.68 ? away.colors[rng.chance(0.7) ? 0 : 1] : rng.pick(neutral);
      fans.push({ x, y: 2 + row * 4, shirt, skin: SKINS[rng.int(0, 4)], hat: rng.chance(0.15) ? rng.pick([home.colors[0], '#f2f2f2', '#1d1d1d']) : null, sign: rng.chance(0.012), ph: rng.next() });
    }
    const frames = [];
    for (let f = 0; f < 3; f++) {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.fillStyle = '#20263a'; g.fillRect(0, 0, W, H);
      for (let row = 0; row < 10; row++) { g.fillStyle = row % 2 ? '#262d44' : '#1c2235'; g.fillRect(0, 1 + row * 4 + 3, W, 1); }
      for (const p of fans) {
        const up = f === 0 ? 0 : (p.ph < (f === 1 ? 0.35 : 0.7)) ? 1 : 0;
        g.fillStyle = p.shirt; g.fillRect(p.x, p.y + 1 - up, 1, 2);
        g.fillStyle = p.skin; g.fillRect(p.x, p.y - up, 1, 1);
        if (p.hat) { g.fillStyle = p.hat; g.fillRect(p.x, p.y - up, 1, 1); }
        if (f > 0 && up && p.ph < 0.2) { g.fillStyle = p.skin; g.fillRect(p.x + (p.ph < 0.1 ? 1 : -1), p.y - 1 - up, 1, 1); }
        if (p.sign) { g.fillStyle = '#f4f1e6'; g.fillRect(p.x - 1, p.y - 2 - up, 4, 2); g.fillStyle = home.colors[0]; g.fillRect(p.x, p.y - 2 - up, 2, 1); }

  },
  drawStadium(m, game) {
    const g = this.g;

    g.fillStyle = '#122045'; g.fillRect(0, yCrowdBot, this.cv.width, yWallBot - yCrowdBot);
    const words = m ? [m.user.city.toUpperCase(), 'TOUCHBACK', m.opp.city.toUpperCase(), 'PIXEL PRO FOOTBALL'] : ['TOUCHBACK'];

  grassTile() {

  drawField(m) {

        g.globalAlpha = 0.12; g.fillStyle = '#000'; for (let y = y0; y < y1; y += Math.max(2, Math.round(sd * 0.5))) g.fillRect(xa, y, xb - xa, 1); g.globalAlpha = 1;
        const px = Math.max(2, Math.round(sd * 0.36));

        g.save();
        const cx = (xa + xb) / 2, len = word.length * 6 * px;
        g.translate(cx, (y0 + y1) / 2); g.rotate(x0 < 0 ? -Math.PI / 2 : Math.PI / 2);

      g.globalAlpha = 0.92; g.drawImage(lg, this.X(50) - w / 2, this.Y(MID_Y) - h / 2, w, h); g.globalAlpha = 1;
    }
    // lines
    const lw = Math.max(1, Math.round(sd * 0.12));
    g.fillStyle = 'rgba(255,255,255,0.92)';
    for (let x = Math.ceil(left / 5) * 5; x <= right; x += 5) {
      if (x < 0 || x > 100) continue;
      const w = (x === 0 || x === 100) ? lw * 2 : lw;

    }
    for (const xe of [-10, 110]) if (xe >= left && xe <= right) g.fillRect(this.X(xe) - lw, y0, lw * 2, y1 - y0);
    // the 6-foot white border around the field
    const sl = Math.max(2, Math.round(sd * 0.32));
    g.fillRect(this.X(-10), y0 - sl, this.X(110) - this.X(-10), sl); g.fillRect(this.X(-10), y1, this.X(110) - this.X(-10), sl);

    if (w.kind === 'snow') { g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, this.Y(0), W, this.Y(FIELD_W) - this.Y(0)); }
    g.fillStyle = w.kind === 'rain' ? 'rgba(180,200,255,0.55)' : 'rgba(255,255,255,0.85)';
    const ps = Math.max(1, Math.round(this.dpr * (w.kind === 'snow' ? 2 : 1)));

      const sp = w.kind === 'rain' ? 900 : 70;
      p.y += sp * dt * this.dpr * (0.6 + p.s * 0.6); p.x += (w.wx * 12 + (w.kind === 'snow' ? Math.sin(this.time + p.s * 9) * 20 : 0)) * dt * this.dpr;
      if (p.y > H) { p.y = -10; p.x = Math.random() * W; } if (p.x > W) p.x -= W; if (p.x < 0) p.x += W;

  },
  drawBanner(m) {
    const b = m.banner; if (!b) return;
    const g = this.g, W = this.cv.width;
    const a = Math.min(1, b.t * 6);
    const px = Math.max(3, Math.round((this.phone ? 3 : 4.5) * this.dpr));
    const y = Math.round((this.hud + (this.phone ? 18 : 40)) * this.dpr);
    const tw = PixFont.width(b.text, px), bw = Math.min(W - 20, tw + px * 12);

    g.fillStyle = b.color; g.fillRect((W - bw) / 2, y, bw, Math.round(px * 0.6));
    PixFont.draw(g, b.text, W / 2, y + px * 2.5, px, b.color, 'center', '#000');
    if (b.sub) PixFont.draw(g, b.sub, W / 2, y + px * 11, Math.max(2, Math.round(px * 0.5)), '#f3efe2', 'center');

  },
  // broadcast-style card naming the player you control
  drawNameCard(m, game) {

    const p = sim.carrier || (sim.ball.holder === sim.qb ? sim.qb : null);

    const label = `#${p.num} ${p.name} [${p.pos}]`.toUpperCase();
    const w = PixFont.width(label, px) + px * 16, h = px * 11;
