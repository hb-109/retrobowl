    g.fillStyle = m.uniU.trim; g.fillRect(x + px * 5, y + px * 2, px, px * 3);
    g.fillStyle = '#d7dadf'; g.fillRect(x + px * 8, y + px * 5, px, px * 3);
    PixFont.draw(g, label, x + px * 11, y + px * 2, px, '#f3efe2');
  },
  drawHUD(m, game) {
    const g = this.g, dp = this.dpr, W = this.cv.width, h = Math.round(this.hud * dp);
    g.fillStyle = '#05070d'; g.fillRect(0, 0, W, h);
    g.fillStyle = '#ffd23f'; g.fillRect(0, h - Math.round(2 * dp), W, Math.round(2 * dp));
    const px = Math.max(2, Math.round((this.phone ? 2 : this.hud >= 56 ? 3 : 2.5) * dp));
    const ty = Math.round((h - 7 * px) / 2) - Math.round(dp);
    const safeL = (game.safe.l + (this.phone ? 52 : 64)) * dp, safeR = (game.safe.r + 12) * dp;
    const cx = W / 2;
    const bw = px * 34, gap = px * 5;
    const box = (x, team, score, uni, tos) => {
      g.fillStyle = uni.jersey; g.fillRect(x, ty - px, px * 4, px * 9);
      g.fillStyle = shade(uni.jersey, -0.5); g.fillRect(x + px * 4, ty - px, Math.max(1, px >> 1), px * 9);
      PixFont.draw(g, team.abbr, x + px * 6, ty, px, '#f3efe2');
      PixFont.draw(g, String(score), x + bw, ty, px, '#ffd23f', 'right');
      for (let i = 0; i < 3; i++) { g.fillStyle = i < tos ? '#ffd23f' : '#333b55'; g.fillRect(x + px * 6 + i * px * 4, ty + px * 8, px * 3, Math.max(1, px >> 1)); }
    };
    const clockTxt = (m.ot ? 'OT' : 'Q' + m.q) + ' ' + fmtClock(m.clock);
    const clusterW = bw * 2 + gap * 2 + PixFont.width(clockTxt, px) + px * 4;
    let info = '';
    if (m.drill) info = '3RD & 5 · DRILL';
    else if (m.state === 'oppDrive') info = m.opp.abbr + ' BALL';
    else if (m.twoPoint) info = '2-PT TRY';
    else if (m.poss === 'u' && m.sim && m.sim.kind !== 'return') info = downText(m.down, m.toGo, m.los) + ' · ' + spotText(m.los, m.user.abbr, m.opp.abbr);
    const infoW = info ? PixFont.width(info, px) : 0;
    let leftX = Math.max(safeL, Math.round(cx - clusterW / 2 - (info ? infoW / 3 : 0)));
    box(leftX, m.user, m.score.u, m.uniU, m.to.u);
    box(leftX + bw + gap, m.opp, m.score.o, m.uniO, m.to.o);
    const midX = leftX + 2 * bw + gap * 2 + px * 4;
    PixFont.draw(g, clockTxt, midX, ty, px, m.clockRunning && m.state === 'presnap' ? '#ff9d3c' : '#f3efe2');
    const infoFits = info && (midX + PixFont.width(clockTxt, px) + px * 8 + infoW <= W - safeR);
    if (infoFits) PixFont.draw(g, info, W - safeR, ty, px, '#ffd23f', 'right');
    else if (info) {
      const sp = Math.max(2, px - 1), w2 = PixFont.width(info, sp) + sp * 6;
      g.fillStyle = 'rgba(11,16,32,0.85)'; g.fillRect(cx - w2 / 2, h, w2, sp * 11);
      PixFont.draw(g, info, cx, h + sp * 2, sp, '#ffd23f', 'center');
    }
    if (m.weather && m.weather.kind !== 'clear' && !this.phone) PixFont.draw(g, m.weather.kind.toUpperCase() + (m.weather.kind === 'wind' ? ' ' + Math.round(Math.hypot(m.weather.wx, m.weather.wy) * 2) + ' MPH' : ''), W - safeR, h + px * 3, Math.max(2, px - 1), '#9fb3d9', 'right', '#000');
    if (m.state === 'presnap' && m.sim && !m.twoPoint && !m.drill) {
      const p = PLAYBOOK[m.playIdx], sp = Math.max(2, px - 1);
      const pn = `${p.name} · ${FORMATION_NAMES[p.form || 'gun']} · ${PLAY_TYPE_LABEL[p.type || 'pass']}`;
      const read = 'READ: ' + (LOOK_LABEL[m.sim.look] || '');
      const x = Math.round((game.safe.l + 10) * dp), y = Math.round((this.hud + 8) * dp);
      const bw = Math.max(PixFont.width(pn, sp), PixFont.width(read, sp)) + sp * 6;
      g.fillStyle = 'rgba(8,12,24,0.8)'; g.fillRect(x, y, bw, sp * 21);
      g.fillStyle = '#ffd23f'; g.fillRect(x, y, Math.max(2, Math.round(sp / 2)), sp * 21);
      PixFont.draw(g, pn, x + sp * 3, y + sp * 3, sp, '#f3efe2');
      PixFont.draw(g, read, x + sp * 3, y + sp * 12, sp, '#9fd3ff');
    }
  },
};


// ==== input.js ====
// ---------- touch / mouse / keyboard ----------
// One "primary" pointer drives every gesture. While it aims, any other pointer that
// lands on the field toggles lob/bullet; only releasing the primary throws.
// With the ball in a runner's hands: a quick flick jukes, dives or hesitates, a slow
// drag steers him in any direction, and holding still charges a truck.
const Input = {
  game: null, cv: null, primary: null, others: new Set(), lastType: 'mouse', keysDown: new Set(), held: {},
  AIM_START: 12, SWIPE: 26, FLICK_MS: 220, HOLD_MS: 220, STEER_FULL: 70,
  init(game, cv) {
    this.game = game; this.cv = cv;
    const opt = { passive: false };
    cv.addEventListener('pointerdown', (e) => this.down(e), opt);
    cv.addEventListener('pointermove', (e) => this.move(e), opt);
    cv.addEventListener('pointerup', (e) => this.up(e), opt);
    cv.addEventListener('pointercancel', (e) => this.cancel(e), opt);
    cv.addEventListener('lostpointercapture', (e) => { if (this.primary && e.pointerId === this.primary.id && !this.primary.ended) this.cancel(e); });
    cv.addEventListener('mousedown', (e) => { if (e.button === 2) { e.preventDefault(); this.toggle('mouse-right'); } });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, opt);
    cv.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, opt);
    cv.addEventListener('dblclick', (e) => e.preventDefault());
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, (e) => { if (game.inPlay()) e.preventDefault(); }, opt));
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
  },
  pos(e) { const r = this.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
  dragMax() { return clamp(Math.min(Render.W, Render.H) * 0.24, 90, 170); },
  down(e) {
    e.preventDefault();
    Sound.unlock();
    this.lastType = e.pointerType || 'mouse';
    this.game.inputType = this.lastType;
    if (e.pointerType === 'mouse' && e.button !== 0) return; // right button handled by mousedown
    if (this.primary) {
      // second finger: toggles throw type while aiming; never throws
      this.others.add(e.pointerId);
      if (this.primary.mode === 'aim') this.toggle('second-finger');
      return;
    }
    try { this.cv.setPointerCapture(e.pointerId); } catch (_) { }
    const p = this.pos(e);
    this.primary = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t0: performance.now(), mode: 'pending', ctx: this.game.mode(), type: e.pointerType };
    if (this.primary.ctx === 'meter' || this.primary.ctx === 'result' || this.primary.ctx === 'retAir') { this.tap(p); this.primary.mode = 'done'; }
  },
  move(e) {
    const P = this.primary;
    if (!P || e.pointerId !== P.id) return;
    e.preventDefault();
    const p = this.pos(e); P.x = p.x; P.y = p.y;
    const dx = P.x - P.x0, dy = P.y - P.y0, d = Math.hypot(dx, dy), age = performance.now() - P.t0;
    const ctx = this.game.mode();
    if (P.mode === 'aim') { this.updateAim(); return; }
    if (P.mode === 'steer') { this.updateSteer(); return; }
    if (P.mode === 'hold') { if (d > 24 && (ctx === 'carrier' || ctx === 'qbrun')) { P.mode = 'steer'; P.truck = true; this.updateSteer(); } return; }
    if (P.mode !== 'pending') return;
    if ((ctx === 'pre' || ctx === 'qb') && d > this.AIM_START) {
      if (ctx === 'pre') this.game.snap();
      if (this.game.mode() === 'qb') { P.mode = 'aim'; this.game.beginAim(); this.updateAim(); }
      return;
    }
    if (ctx === 'carrier' || ctx === 'qbrun') {
      if (d > this.SWIPE && age < this.FLICK_MS) { this.swipe(dx, dy); P.mode = 'done'; return; }
      if (d > this.AIM_START && age >= this.FLICK_MS) {
        // a scrambling QB pulling back behind the line is aiming; anything else steers
        if (ctx === 'qbrun' && this.game.canThrow() && dx < -Math.abs(dy) * 0.5) { P.mode = 'aim'; this.game.beginAim(); this.updateAim(); }
        else { P.mode = 'steer'; this.updateSteer(); }
      }
    }
  },
  updateAim() {
    const P = this.primary, aim = this.game.aim, s = Render.aimS();
    const dx = P.x - P.x0, dy = P.y - P.y0, len = Math.hypot(dx, dy);
    aim.power = clamp(len / this.dragMax(), 0, 1);
    if (len > 2) { aim.fx = -dx / s; aim.fy = -dy / (s * KY); }
  },
  updateSteer() {
    const P = this.primary, s = Render.aimS();
    const dx = P.x - P.x0, dy = P.y - P.y0, len = Math.hypot(dx, dy);
    if (len < 6) { this.game.steer(null); return; }
    this.game.steer({ x: dx / s, y: dy / (s * KY), str: clamp(len / this.STEER_FULL, 0, 1) });
  },
  up(e) {
    if (this.others.has(e.pointerId)) { this.others.delete(e.pointerId); return; } // lifting the 2nd finger keeps the aim
    const P = this.primary;
    if (!P || e.pointerId !== P.id) return;
    e.preventDefault();
    P.ended = true; this.primary = null;
    try { this.cv.releasePointerCapture(e.pointerId); } catch (_) { }
    if (P.mode === 'aim') { this.game.releaseAim(); return; }
    if (P.mode === 'steer') { this.game.steer(null); if (P.truck) this.game.truck(false); return; }
    if (P.mode === 'hold') { this.game.truck(false); return; }
    const d = Math.hypot(P.x - P.x0, P.y - P.y0), age = performance.now() - P.t0;
    if (P.mode === 'pending') {
      const ctx = this.game.mode();
      if ((ctx === 'carrier' || ctx === 'qbrun') && d > this.SWIPE * 0.8 && age < 450) { this.swipe(P.x - P.x0, P.y - P.y0); return; }
      if (d < this.AIM_START + 4 && age < 600) this.tap({ x: P.x, y: P.y });
    }
  },
  cancel(e) {
    if (this.others.has(e.pointerId)) { this.others.delete(e.pointerId); return; }
    const P = this.primary;
    if (!P || e.pointerId !== P.id) return;
    P.ended = true; this.primary = null;
    if (P.mode === 'aim') this.game.cancelAim();
    if (P.mode === 'hold' || P.truck) this.game.truck(false);
    if (P.mode === 'steer') this.game.steer(null);
  },
  // drop every gesture (rotation, resize, app switch)
  reset() {
    if (this.primary) { const P = this.primary; this.primary = null; P.ended = true; if (P.mode === 'aim') this.game.cancelAim(); if (P.mode === 'hold' || P.truck) this.game.truck(false); if (P.mode === 'steer') this.game.steer(null); try { this.cv.releasePointerCapture(P.id); } catch (_) { } }
    this.others.clear(); this.held = {};
    if (this.keysDown.has('truck')) { this.keysDown.delete('truck'); this.game.truck(false); }
  },
  update() {
    const P = this.primary;
    if (P && P.mode === 'pending') {
      const ctx = this.game.mode();
      if ((ctx === 'carrier' || ctx === 'qbrun') && performance.now() - P.t0 > this.HOLD_MS && Math.hypot(P.x - P.x0, P.y - P.y0) < this.AIM_START) {
        P.mode = 'hold'; this.game.truck(true);
      }
    }
    // keyboard: holding an arrow steers after a short tap window
    const ctx = this.game.mode();
    if (ctx === 'carrier' || ctx === 'qbrun') {
      const now = performance.now(), h = this.held;
      const on = (k) => h[k] && now - h[k] > 180;
      const vx = (on('right') ? 1 : 0) - (on('left') ? 1 : 0), vy = (on('down') ? 1 : 0) - (on('up') ? 1 : 0);
      if (vx || vy) { this.keySteer = true; this.game.steer({ x: vx || 0.35, y: vy, str: 1 }); }
      else if (this.keySteer) { this.keySteer = false; this.game.steer(null); }
    } else if (this.keySteer) { this.keySteer = false; }
  },
  toggle(src) {
    const aim = this.game.aim;
    if (!aim.active) return false;
    aim.mode = aim.mode === 'lob' ? 'bullet' : 'lob';
    aim.toggles++;
    Sound.blip(); vibrate(10);
    this.game.onToggle && this.game.onToggle(src);
    return true;
  },
  tap(p) {
    const g = this.game, ctx = g.mode();
    if (ctx === 'meter') { g.meterTap(); return; }
    if (ctx === 'result') { g.skip(); return; }
    if (ctx === 'retAir') { g.fairCatch(); return; }
    const f = Render.toField(p.x, p.y), sim = g.match && g.match.sim;
    if (!sim) return;
    const near = (e) => dist(f.x, f.y, e.x, e.y) < Math.max(2.6, 46 / Render.s);
    if (ctx === 'pre') { if (near(sim.rb) && sim.handoffOpen) { g.snap(); sim.autoHandoff = true; } else g.snap(); return; }
    if (ctx === 'qb') { if (near(sim.rb) && g.handoff()) return; if (near(sim.qb)) g.scramble(); }
  },
  swipe(dx, dy) {
    const g = this.game;
    if (Math.abs(dy) > Math.abs(dx) * 0.9) g.juke(dy < 0 ? -1 : 1);
    else if (dx > 0) g.dive(); else g.hesitate();
  },
  key(e, isDown) {
    const g = this.game;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const k = e.key;
    const dirOf = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
    if (!isDown) {
      if (dirOf[k]) delete this.held[dirOf[k]];
      if ((k === 'Shift' || k === 't' || k === 'T') && this.keysDown.has('truck')) { this.keysDown.delete('truck'); g.truck(false); }
      return;
    }
    if (!g.match || g.paused) { if (k === 'Escape' && g.paused) g.resume(); return; }
    this.lastType = 'keyboard'; g.inputType = 'keyboard';
    const ctx = g.mode(), running = ctx === 'carrier' || ctx === 'qbrun';
    if (dirOf[k] && running && !e.repeat) this.held[dirOf[k]] = performance.now();
    if (e.repeat && dirOf[k]) { e.preventDefault(); return; }
    let used = true;
    if (k === 'b' || k === 'B') { if (!this.toggle('key-b')) used = false; }
    else if (k === ' ' || k === 'Enter') {
      if (ctx === 'pre') g.snap(); else if (ctx === 'meter') g.meterTap(); else if (ctx === 'result') g.skip(); else if (ctx === 'retAir') g.fairCatch(); else if (ctx === 'qb') g.handoff(); else used = false;
    }
    else if (k === 'h' || k === 'H') { if (ctx === 'pre') { g.snap(); g.match.sim.autoHandoff = true; } else g.handoff(); }
    else if (k === 'r' || k === 'R') { if (ctx === 'qb') g.scramble(); else if (g.replayAvailable()) g.startReplay(); }
    else if (k === 'f' || k === 'F') g.fairCatch();
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (running) g.juke(-1); else used = false; }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { if (running) g.juke(1); else used = false; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (running) g.dive(); else if (ctx === 'qb') g.scramble(); else used = false; }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (running) g.hesitate(); else if (ctx === 'pre') g.audible(); else used = false; }
    else if (k === 'Shift' || k === 't' || k === 'T') {
      if (running && !this.keysDown.has('truck')) { this.keysDown.add('truck'); g.truck(true); }
      else if (k !== 'Shift' && ctx === 'pre') g.timeout(); else used = false;
    }
    else if (k === 'p' && ctx === 'pre') g.openPlaybook && g.openPlaybook();
    else if (k === 'Escape' || k === 'P') g.pause('menu');
    else used = false;
    if (used) e.preventDefault();
  },
};


// ==== league.js ====
// ---------- franchise / league ----------
const SAVE_KEY = 'touchback.save.v1';
const TRADE_DEADLINE = 10; // week index after which in-season trades close
const LG = {
  // ---------- creation ----------
  create({ coach, teamId, seed }) {
    const rng = new RNG(seed || (Math.random() * 1e9) | 0);
    const teams = makeTeams(rng);
    // make the chosen team a struggling one
    const t = teams[teamId];
    t.off = Math.min(t.off, rng.int(48, 56)); t.def = Math.min(t.def, rng.int(48, 56));
    for (const tm of teams) tm.coach = coachName(rng);
    const L = {
      v: 2, seed: rng.int(1, 1e9), year: 1, week: 0, phase: 'regular', teamId,
      coach: { name: coach || 'Coach', cc: 12, wins: 0, losses: 0, titles: 0, pwins: 0 },
      teams, schedule: [], roster: [], staff: { oc: 0, dc: 0 }, fac: { stadium: 1, training: 1, rehab: 1 },
      training: 'normal', fans: 45, picks: [], fa: [], draft: null, playoffs: null, champions: [], hof: [],
      records: { game: {}, season: {}, career: {} }, news: [], event: null, history: [], scoutPts: 0, lastResult: null,
      retiredNums: [], seasonStart: true, owner: { conf: 65, goal: null, history: [] }, awards: [], tradedPicks: [], offers: null,
    };
    for (const tm of teams) if (tm.id !== teamId) LG.genAIRoster(L, tm, rng);
    LG.genRoster(L, rng);
    for (let r = 1; r <= 3; r++) L.picks.push({ year: 1, round: r, from: teamId });
    L.schedule = LG.genSchedule(teams, rng);
    L.fa = LG.genFreeAgents(L, rng, 26);
    LG.news(L, `${coach || 'Coach'} hired by the ${t.city} ${t.name}. Fans want a turnaround.`);
    LG.backfillRatings(L);
    LG.setGoal(L);
    return L;
  },
  rng(L) { L.seed = (L.seed * 1103515245 + 12345) >>> 0; return new RNG(L.seed); },
  genRoster(L, rng) {
    const plan = [['QB', 4.6], ['RB', 4.8], ['WR', 5.2], ['WR', 4.2], ['TE', 4.2], ['OL', 4.6], ['OL', 4.0], ['DL', 4.8], ['DL', 4.0], ['LB', 5.0], ['DB', 4.6], ['DB', 4.0], ['K', 5.0]];
    const taken = new Set();
    const star = rng.int(0, plan.length - 2);
    plan.forEach(([pos, q], i) => {
      const age = rng.int(22, 31);
      const p = genPlayer(rng, pos, i === star ? q + 1.6 : q, age, { taken, year: 1 });
      L.roster.push(p);
    });
  },
  genFreeAgents(L, rng, n) {
    const out = [];
    const mix = ['QB', 'RB', 'WR', 'WR', 'TE', 'OL', 'OL', 'DL', 'DL', 'LB', 'LB', 'DB', 'DB', 'K'];
    for (let i = 0; i < n; i++) {
      const pos = rng.pick(mix), age = rng.int(23, 33);
      const q = clamp(rng.normal(4.4, 1.0) - (age > 30 ? 0.3 : 0), 2.2, 7.4);
      const p = genPlayer(rng, pos, q, age, { year: L.year });
      p.salary = Math.round(p.salary * rng.range(0.85, 1.15) * 10) / 10;
      p.years = rng.int(1, 3);
      out.push(p);
    }
    LG.ensureFA({ fa: out, year: L.year }, null, rng);
    return out.sort((a, b) => b.ovr - a.ovr);
  },
  // keep at least two street free agents at every position (or at one position)
  ensureFA(L, pos, rng) {
    rng = rng || LG.rng(L);
    for (const ps of pos ? [pos] : POSITIONS) {
      let have = L.fa.filter(p => p.pos === ps).length;
      while (have < 2) {
        const p = genPlayer(rng, ps, clamp(rng.normal(3.9, 0.6), 2.5, 5.5), rng.int(24, 32), { year: L.year });
        p.years = 1; L.fa.push(p); have++;
      }
    }
    L.fa.sort((a, b) => b.ovr - a.ovr);
  },
  team(L, id = L.teamId) { return L.teams[id]; },
  userTeam(L) { return L.teams[L.teamId]; },
  capUsed(L) { return Math.round(L.roster.reduce((s, p) => s + p.salary, 0) * 10) / 10; },
  capSpace(L) { return Math.round((SALARY_CAP - LG.capUsed(L)) * 10) / 10; },
  news(L, text) { L.news.unshift({ y: L.year, w: L.week + 1, text }); if (L.news.length > 40) L.news.length = 40; },
  backfillRatings(L) { const r = lineupRatings(buildLineup(L.roster, 1)); const t = LG.userTeam(L); t.off = r.off; t.def = r.def; t.kick = r.kick; },

  // ---------- schedule: 6 division games (home & away) + 11 others, one bye in weeks 5-12 ----------
  genSchedule(teams, rng) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const s = LG._trySchedule(teams, rng);
      if (s) return s;
    }
    throw new Error('schedule failed');
  },
  _trySchedule(teams, rng) {
    const N = teams.length, weeks = Array.from({ length: 18 }, () => []);
    const divWeeks = [1, 5, 9, 14, 16, 17];
    const byDiv = {};
    teams.forEach(t => { (byDiv[t.conf * 4 + t.div] = byDiv[t.conf * 4 + t.div] || []).push(t.id); });
    const homeCount = new Array(N).fill(0);
    const addGame = (w, a, b) => {
      let h = a, aw = b;
      if (homeCount[b] < homeCount[a] || (homeCount[a] === homeCount[b] && rng.chance(0.5))) { h = b; aw = a; }
      homeCount[h]++; weeks[w].push({ h, a: aw, hs: null, as: null, done: false });
    };
    // division round robin twice (3 matchings x 2)
    const order = rng.shuffle([0, 1, 2, 3, 4, 5]);
    for (const d in byDiv) {
      const [p, q, r, s] = byDiv[d];
      const ms = [[[p, q], [r, s]], [[p, r], [q, s]], [[p, s], [q, r]]];
      divWeeks.forEach((w, i) => {
        const m = ms[order[i] % 3];
        for (const [a, b] of m) {
          // second meeting flips home field
          const first = order[i] < 3;
          let h = first ? a : b, aw = first ? b : a;
          homeCount[h]++; weeks[w].push({ h, a: aw, hs: null, as: null, done: false });
        }
      });
    }
    // non-division weeks; each division takes one bye week together
    const otherWeeks = [...Array(18).keys()].filter(w => !divWeeks.includes(w));
    const byeWeeks = otherWeeks.filter(w => w >= 4 && w <= 13).slice(0, 8);
    const divOrder = rng.shuffle([...Array(8).keys()]);
    const byeOf = {}; byeWeeks.forEach((w, i) => { byeOf[w] = new Set(byDiv[divOrder[i]]); });
    const played = new Set();
    const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
    const sameDiv = (a, b) => teams[a].conf === teams[b].conf && teams[a].div === teams[b].div;
    for (const w of otherWeeks) {
      let ok = false;
      for (let tries = 0; tries < 300 && !ok; tries++) {
        const pool = rng.shuffle([...Array(N).keys()].filter(t => !(byeOf[w] && byeOf[w].has(t))));
        const pairs = [];
        const used = new Set();
        ok = true;
        for (const t of pool) {
          if (used.has(t)) continue;
          const opts = pool.filter(o => o !== t && !used.has(o) && !sameDiv(t, o) && !played.has(key(t, o)));
          if (!opts.length) { ok = false; break; }
          // prefer same-conference opponents a bit
          const o = rng.chance(0.6) ? (opts.find(x => teams[x].conf === teams[t].conf) ?? opts[0]) : opts[0];
          used.add(t); used.add(o); pairs.push([t, o]);
        }
        if (ok) { for (const [a, b] of pairs) { played.add(key(a, b)); addGame(w, a, b); } }
      }
      if (!ok) return null;
    }
    return weeks;
  },
  userGameInWeek(L, w) { return (L.schedule[w] || []).find(g => g.h === L.teamId || g.a === L.teamId) || null; },

  // ---------- standings ----------
  table(L) {
    const T = L.teams.map(t => ({ id: t.id, t, w: 0, l: 0, pf: 0, pa: 0, dw: 0, dl: 0, cw: 0, cl: 0, streak: '' }));
    for (const wk of L.schedule) for (const g of wk) {
      if (!g.done) continue;
      const H = T[g.h], A = T[g.a];
      H.pf += g.hs; H.pa += g.as; A.pf += g.as; A.pa += g.hs;
      const hw = g.hs > g.as;
      (hw ? H : A).w++; (hw ? A : H).l++;
      const div = H.t.conf === A.t.conf && H.t.div === A.t.div, conf = H.t.conf === A.t.conf;
      if (div) { (hw ? H : A).dw++; (hw ? A : H).dl++; }
      if (conf) { (hw ? H : A).cw++; (hw ? A : H).cl++; }
    }
    return T;
  },
  sortRows(rows) {
    return rows.sort((a, b) => {
      const pa = a.w / Math.max(1, a.w + a.l), pb = b.w / Math.max(1, b.w + b.l);
      if (pb !== pa) return pb - pa;
      if (b.dw - b.dl !== a.dw - a.dl) return (b.dw - b.dl) - (a.dw - a.dl);
      return (b.pf - b.pa) - (a.pf - a.pa) || a.id - b.id;
    });
  },
  seeds(L, conf) {
    const T = LG.table(L).filter(r => r.t.conf === conf);
    const winners = [];
    for (let d = 0; d < 4; d++) winners.push(LG.sortRows(T.filter(r => r.t.div === d))[0]);
    const div = LG.sortRows(winners.slice());
    const rest = LG.sortRows(T.filter(r => !winners.includes(r))).slice(0, 3);
    return [...div, ...rest].map(r => r.id);
  },

  // ---------- quick game sim for AI vs AI ----------
  quickGame(L, hId, aId, rng) {
    const H = L.teams[hId], A = L.teams[aId];
    const T = [H, A], score = [0, 0];
    const Q = 900, R = runoffFor(Q);
    let q = 1, clock = Q, poss = rng.chance(0.5) ? 0 : 1, first = poss, spot = 25, guard = 0;
    // named players on both sides so every simulated game feeds the league leaders
    const seed = rng.int(1, 1e9);
    const lineups = [buildLineup(LG.rosterOf(L, hId), seed, 'hrep'), buildLineup(LG.rosterOf(L, aId), seed + 1, 'arep')];
    const cred = (lu, pos) => lu.all.filter(p => pos.includes(p.pos)).map(p => ({ name: shortName(p), pid: p.rep ? null : p.id, pos: p.pos, rating: (p.ovr || 40) / 10, star: !p.rep }));
    const offC = lineups.map(lu => makeOffCredit(rng, cred(lu, ['QB', 'RB', 'WR', 'TE', 'K'])));
    const defC = lineups.map(lu => makeDefCredit(rng, cred(lu, ['DL', 'LB', 'DB'])));
    const box = {};
    const add = (pid, k, v = 1) => { if (pid) (box[pid] = box[pid] || {})[k] = ((box[pid] || {})[k] || 0) + v; };
    const kickerId = (i) => { const k = lineups[i].K[0]; return k && !k.rep ? k.id : null; };
    const homeAdv = 1.5 + (hId === L.teamId ? L.fac.stadium * 0.6 : 0);
    while (guard++ < 60) {
      const st = { spot, q, clock, Q, diff: score[poss] - score[1 - poss], toOff: 3, toDef: 3, ot: false };
      const out = simDrive(st, { rng, verbose: false, R, kick: T[poss].kick || 6, weather: null, offR: T[poss].off + (poss === 0 ? homeAdv : 0), defR: T[1 - poss].def + (poss === 1 ? homeAdv : 0), mAdj: 0, offAbbr: '', defAbbr: '', who: offC[poss], dfn: defC[1 - poss] });
      for (const s of out.stats) add(s.pid, s.k, s.v == null ? 1 : s.v);
      q = out.q; clock = out.clock;
      const r = out.result;
      const other = 1 - poss;
      if (r.type === 'td') { const xp = rng.chance(0.95); score[poss] += xp ? 7 : 6; add(kickerId(poss), 'xpa'); if (xp) add(kickerId(poss), 'xpm'); spot = 25; poss = other; }
      else if (r.type === 'pick6') { score[other] += 7; spot = 25; }
      else if (r.type === 'fg') { score[poss] += 3; spot = 25; poss = other; }
      else if (r.type === 'safety') { score[other] += 2; spot = 35; poss = other; }
      else if (r.type === 'half') { q = 3; clock = Q; poss = 1 - first; spot = 25; }
      else if (r.type === 'end') break;
      else { spot = r.recvSpot || 25; poss = other; }
      if (q > 4 || (q === 4 && clock <= 0)) break;
    }
    if (score[0] === score[1]) { const p = 0.5 + (T[0].off + T[0].def - T[1].off - T[1].def) / 400; const w = rng.chance(p) ? 0 : 1; score[w] += 3; add(kickerId(w), 'fga'); add(kickerId(w), 'fgm'); }
    // credit the box score and roll the odd injury for AI clubs
    for (let i = 0; i < 2; i++) {
      for (const p of lineups[i].all) if (!p.rep) { const b = box[p.id] || {}; b.gp = 1; LG.credit(p, b); }
      LG.aiInjury(L, T[i], lineups[i], rng);
    }
    return { hs: score[0], as: score[1] };
  },
  simOthers(L, week, rng) {
    for (const g of L.schedule[week]) {
      if (g.done || g.h === L.teamId || g.a === L.teamId) continue;
      const r = LG.quickGame(L, g.h, g.a, rng); g.hs = r.hs; g.as = r.as; g.done = true;
    }
  },

  // ---------- after the user's game ----------
  // m: Match (finished); returns summary
  finishUserGame(L, m, gameRef) {
    const rng = LG.rng(L);
    const us = m.score.u, them = m.score.o, won = us > them;
    gameRef.done = true;
    if (gameRef.h === L.teamId) { gameRef.hs = us; gameRef.as = them; } else { gameRef.hs = them; gameRef.as = us; }
    // stats into players
    const played = new Set(m.UL.all.filter(p => !p.rep).map(p => p.id));
    for (const p of L.roster) {
      if (!played.has(p.id)) continue;
      const b = m.box[p.id] || blankStats();
      b.gp = 1;
      for (const k in b) { p.season[k] = (p.season[k] || 0) + b[k]; p.career[k] = (p.career[k] || 0) + b[k]; }
      LG.checkRecord(L, 'game', p, b);
      p.cond = clamp(p.cond - rng.int(6, 13) * (L.training === 'high' ? 1.25 : L.training === 'low' ? 0.8 : 1), 30, 100);
    }
    // the opponent's named players get their numbers too
    const oppT = m.opp;
    if (oppT.roster) {
      const oppPlayed = new Set(m.OL.all.filter(p => !p.rep).map(p => p.id));
      for (const p of oppT.roster) if (oppPlayed.has(p.id)) { const b = Object.assign({}, m.box[p.id] || {}); b.gp = 1; LG.credit(p, b); }
    }
    LG.ownerWeek(L, won, !!gameRef.playoff);
    // results, credits, fans
    let cc = won ? 3 : 1;
    if (won && oppT.off + oppT.def > LG.userTeam(L).off + LG.userTeam(L).def + 8) cc += 2;
    if (gameRef.playoff) cc += won ? 4 : 0;
    if (L.fans >= 75) cc += 1;
    L.coach.cc += cc;
    if (!gameRef.playoff) { if (won) L.coach.wins++; else L.coach.losses++; }
    else if (won) L.coach.pwins++;
    L.fans = clamp(L.fans + (won ? rng.int(2, 5) : -rng.int(1, 4)) + (gameRef.playoff && won ? 4 : 0), 0, 100);
    for (const p of L.roster) p.morale = clamp(p.morale + (won ? rng.int(1, 4) : -rng.int(1, 4)), 0, 100);
    // injuries
    const injuries = [];
    for (const p of L.roster) {
      if (!played.has(p.id)) continue;
      const risk = 0.028 * (1 + (100 - p.cond) / 80) * (L.training === 'high' ? 1.3 : L.training === 'low' ? 0.8 : 1);
      if (rng.chance(risk)) {
        const weeks = Math.max(1, rng.int(1, 6) - (L.fac.rehab - 1 > 0 && rng.chance(0.5) ? 1 : 0));
        p.inj = { weeks, type: rng.pick(['hamstring', 'ankle', 'knee', 'shoulder', 'concussion', 'wrist']) };
        injuries.push(p);
        LG.news(L, `${shortName(p)} (${p.pos}) out ${weeks} week${weeks > 1 ? 's' : ''} with a ${p.inj.type} injury.`);
      }
    }
    const sum = { us, them, won, opp: oppT, cc, injuries, box: m.box, potg: LG.playerOfGame(L, m) };
    L.lastResult = { us, them, won, opp: oppT.abbr, week: L.week, playoff: !!gameRef.playoff };
    LG.news(L, `${won ? 'Won' : 'Lost'} ${us}-${them} ${gameRef.h === L.teamId ? 'vs' : 'at'} ${oppT.city} ${oppT.name}.` + (sum.potg ? ` ${sum.potg.name}: ${sum.potg.line}.` : ''));
    return sum;
  },
  playerOfGame(L, m) {
    let best = null, bs = 0;
    for (const p of L.roster) {
      const b = m.box[p.id]; if (!b) continue;
      const s = b.pyd * 0.04 + b.ptd * 4 - b.pint * 3 + b.ryd * 0.1 + b.rtd * 6 + b.recyd * 0.1 + b.rectd * 6 + b.tkl * 1 + b.sck * 4 + b.dint * 5 + b.fgm * 3;
      if (s > bs) { bs = s; best = { p, b }; }
    }
    if (!best) return null;
    const b = best.b, parts = [];
    if (b.att) parts.push(`${b.cmp}/${b.att}, ${b.pyd} yds, ${b.ptd} TD`);
    if (b.car) parts.push(`${b.ryd} rush yds${b.rtd ? ', ' + b.rtd + ' TD' : ''}`);
    if (b.rec) parts.push(`${b.rec} rec, ${b.recyd} yds${b.rectd ? ', ' + b.rectd + ' TD' : ''}`);
    if (b.tkl || b.sck || b.dint) parts.push(`${b.tkl} tkl${b.sck ? ', ' + b.sck + ' sack' : ''}${b.dint ? ', ' + b.dint + ' INT' : ''}`);
    if (b.fga) parts.push(`${b.fgm}/${b.fga} FG`);
    return { name: shortName(best.p), pos: best.p.pos, line: parts.join(' · ') };
  },
  // weekly upkeep: training, recovery, injuries tick, events; then advance
  advanceWeek(L) {
    const rng = LG.rng(L);
    if (L.phase === 'regular') LG.simOthers(L, L.week, rng);
    const mult = (L.training === 'high' ? 1.5 : L.training === 'low' ? 0.6 : 1) * (1 + (L.fac.training - 1) * 0.15);
    for (const p of L.roster) {
      if (p.inj) { p.inj.weeks--; if (p.inj.weeks <= 0) { p.inj = null; LG.news(L, `${shortName(p)} is back from injury.`); } }
      p.cond = clamp(p.cond + 9 + L.fac.rehab * 2 - (L.training === 'high' ? 4 : 0), 0, 100);
      LG.develop(p, rng, mult * (['QB', 'RB', 'WR', 'TE', 'OL'].includes(p.pos) ? 1 + L.staff.oc * 0.08 : 1 + L.staff.dc * 0.08), 0.06);
    }
    LG.aiWeek(L, rng);
    LG.backfillRatings(L);
    if (L.phase === 'regular') {
      L.week++;
      if (L.week >= 18) LG.startPlayoffs(L);
      else if (!L.event && rng.chance(0.38)) L.event = LG.makeEvent(L, rng);
    }
    LG.save(L);
  },
  develop(p, rng, mult, rate) {
    const keys = POS_ATTRS[p.pos];
    const avg = keys.reduce((s, k) => s + p.attrs[k], 0) / keys.length;
    const ageF = p.age <= 24 ? 1.3 : p.age <= 27 ? 1 : p.age <= 30 ? 0.5 : 0.15;
    const room = p.pot - avg;
    if (room <= 0) return;
    p.xp += room * rate * mult * ageF * (0.6 + p.morale / 200);
    while (p.xp >= 0.1) {
      p.xp -= 0.1;
      const k = rng.pick(keys);
      if (p.attrs[k] < Math.min(10, p.pot + 0.6)) p.attrs[k] = Math.round((p.attrs[k] + 0.1) * 10) / 10;
    }
    refreshPlayer(p);
  },

  // ---------- events with visible consequences ----------
  makeEvent(L, rng) {
    const pick = (fn) => { const pool = L.roster.filter(fn); return pool.length ? rng.pick(pool) : null; };
    const qb = pick(p => p.pos === 'QB') || pick(() => true);
    const star = L.roster.slice().sort((a, b) => b.ovr - a.ovr)[0];
    const lr = L.lastResult;
    const ev = [];
    if (qb && lr && !lr.won) ev.push({ title: 'PRESS CONFERENCE', text: `Reporters ask whether ${shortName(qb)} is still your starting quarterback after the loss to ${lr.opp}.`, pid: qb.id, opts: [
      { label: 'BACK HIM PUBLICLY', fx: { morale: 15, fans: -3 } }, { label: 'DEMAND BETTER', fx: { morale: -10, fans: 3, team: 2 } }] });
    if (star) ev.push({ title: 'LOCKER ROOM', text: `${shortName(star)} wants a bigger role in the game plan.`, pid: star.id, opts: [
      { label: 'PROMISE MORE', fx: { morale: 20, team: -3 } }, { label: 'TELL HIM TO EARN IT', fx: { morale: -12, team: 3 } }] });
    ev.push({ title: 'LOCKER ROOM', text: 'Tension is building after a long week. The leadership group asks for a team meeting.', opts: [
      { label: 'HOLD A MEETING (2 CC)', fx: { cc: -2, team: 7 } }, { label: 'EXTRA PRACTICE', fx: { team: -3, cond: -8, xp: 1 } }] });
    ev.push({ title: 'COMMUNITY', text: 'A local hospital invites the team to a charity event on your day off.', opts: [
      { label: 'ATTEND', fx: { fans: 6, cond: -3 } }, { label: 'REST INSTEAD', fx: { fans: -2, cond: 4 } }] });
    const late = pick(p => p.morale < 70 && p !== qb);
    if (late) ev.push({ title: 'DISCIPLINE', text: `${shortName(late)} was late to the team flight.`, pid: late.id, opts: [
      { label: 'FINE HIM', fx: { morale: -12, team: 4 } }, { label: 'LET IT SLIDE', fx: { morale: 5, team: -4 } }] });
    const offer = rng.chance(0.45) ? LG.makeTradeOffer(L, rng) : null;
    if (offer) return { title: 'TRADE OFFER', text: offer.text, trade: offer, opts: [{ label: 'ACCEPT TRADE', fx: { trade: true } }, { label: 'NO THANKS', fx: {} }] };
    if (lr && lr.won) ev.push({ title: 'PRESS CONFERENCE', text: `After the win over ${lr.opp}, a columnist calls your team "a fluke".`, opts: [
      { label: 'FIRE BACK', fx: { team: 5, fans: 4, morale: 0 } }, { label: 'STAY HUMBLE', fx: { fans: 1 } }] });
    return rng.pick(ev);
  },
  resolveEvent(L, i) {
    const ev = L.event; if (!ev) return null;
    const fx = ev.opts[i].fx, out = [];
    if (fx.trade && ev.trade) {
      const r = LG.executeTrade(L, ev.trade.tid, ev.trade.mine, ev.trade.theirs, [], true);
      out.push(r.ok ? 'Trade complete' : r.msg);
    } else if (ev.trade) out.push('Offer declined');
    const p = ev.pid && L.roster.find(x => x.id === ev.pid);
    if (fx.morale && p) { p.morale = clamp(p.morale + fx.morale, 0, 100); out.push(`${shortName(p)} morale ${fx.morale > 0 ? '+' : ''}${fx.morale}`); }
    if (fx.team) { for (const r of L.roster) if (r !== p) r.morale = clamp(r.morale + fx.team, 0, 100); out.push(`Team morale ${fx.team > 0 ? '+' : ''}${fx.team}`); }
    if (fx.fans) { L.fans = clamp(L.fans + fx.fans, 0, 100); out.push(`Fan support ${fx.fans > 0 ? '+' : ''}${fx.fans}`); }
    if (fx.cc) { L.coach.cc = Math.max(0, L.coach.cc + fx.cc); out.push(`${fx.cc} coaching credits`); }
    if (fx.cond) { for (const r of L.roster) r.cond = clamp(r.cond + fx.cond, 0, 100); out.push(`Condition ${fx.cond > 0 ? '+' : ''}${fx.cond}`); }
    if (fx.xp) { const rng = LG.rng(L); for (const r of L.roster) LG.develop(r, rng, 2, 0.06); out.push('Extra training progress'); }
    if (!ev.trade) LG.news(L, `${ev.title}: ${ev.opts[i].label.toLowerCase()} — ${out.join(', ')}.`);
    L.event = null; LG.save(L);
    return out;
  },

  // ---------- playoffs ----------
  startPlayoffs(L) {
    L.phase = 'playoffs';
    const seeds = [LG.seeds(L, 0), LG.seeds(L, 1)];
    const games = [];
    for (let c = 0; c < 2; c++) { const s = seeds[c]; [[1, 6], [2, 5], [3, 4]].forEach(([a, b]) => games.push({ h: s[a], a: s[b], hs: null, as: null, done: false, round: 0, conf: c, playoff: true, seedH: a + 1, seedA: b + 1 })); }
    L.playoffs = { seeds, round: 0, games, champion: null };
    const inIt = seeds[0].includes(L.teamId) || seeds[1].includes(L.teamId);
    LG.news(L, inIt ? `Playoffs! You are the #${(seeds[0].concat(seeds[1]).indexOf(L.teamId) % 7) + 1} seed.` : 'The regular season is over. You missed the playoffs.');
    LG.save(L);
  },
  playoffRoundGames(L) { return L.playoffs.games.filter(g => g.round === L.playoffs.round); },
  userPlayoffGame(L) { return L.playoffs && LG.playoffRoundGames(L).find(g => !g.done && (g.h === L.teamId || g.a === L.teamId)) || null; },
  advancePlayoffs(L) {
    const rng = LG.rng(L), P = L.playoffs;
    for (const g of LG.playoffRoundGames(L)) if (!g.done) { const r = LG.quickGame(L, g.h, g.a, rng); g.hs = r.hs; g.as = r.as; g.done = true; }
    const winners = LG.playoffRoundGames(L).map(g => ({ id: g.hs > g.as ? g.h : g.a, seed: g.hs > g.as ? g.seedH : g.seedA, conf: g.conf }));
    if (P.round === 3) {
      const f = LG.playoffRoundGames(L)[0];
      P.champion = winners[0].id;
      const loser = f.h === P.champion ? f.a : f.h;
      L.champions.unshift({ year: L.year, id: P.champion, opp: loser, score: Math.max(f.hs, f.as) + '-' + Math.min(f.hs, f.as) });
      if (P.champion === L.teamId) { L.coach.titles++; L.coach.cc += 12; L.fans = clamp(L.fans + 15, 0, 100); }
      LG.news(L, `${L.teams[P.champion].city} ${L.teams[P.champion].name} win Touchback Bowl ${LG.roman(L.year)}!`);
      L.phase = 'seasonEnd'; LG.save(L); return;
    }
    P.round++;
    const next = [];
    if (P.round === 1) {
      for (let c = 0; c < 2; c++) {
        const alive = [{ id: P.seeds[c][0], seed: 1 }, ...winners.filter(w => w.conf === c)].sort((a, b) => a.seed - b.seed);
        next.push({ h: alive[0].id, a: alive[3].id, seedH: alive[0].seed, seedA: alive[3].seed }, { h: alive[1].id, a: alive[2].id, seedH: alive[1].seed, seedA: alive[2].seed });
        next[next.length - 1].conf = c; next[next.length - 2].conf = c;
      }
    } else if (P.round === 2) {
      for (let c = 0; c < 2; c++) { const w = winners.filter(x => x.conf === c).sort((a, b) => a.seed - b.seed); next.push({ h: w[0].id, a: w[1].id, seedH: w[0].seed, seedA: w[1].seed, conf: c }); }
    } else {
      const tab = LG.table(L); const w = winners.slice().sort((a, b) => (tab[b.id].w - tab[a.id].w) || (a.seed - b.seed));
      next.push({ h: w[0].id, a: w[1].id, seedH: w[0].seed, seedA: w[1].seed, conf: -1 });
    }
    for (const g of next) P.games.push(Object.assign({ hs: null, as: null, done: false, round: P.round, playoff: true }, g));
    LG.save(L);
  },
  userAlive(L) {
    if (!L.playoffs) return false;
    const P = L.playoffs;
    if (!P.seeds[0].concat(P.seeds[1]).includes(L.teamId)) return false;
    return !P.games.some(g => g.done && (g.h === L.teamId || g.a === L.teamId) && ((g.h === L.teamId) !== (g.hs > g.as)));
  },
  roundName(r) { return ['WILD CARD', 'DIVISIONAL', 'CONFERENCE', 'TOUCHBACK BOWL'][r]; },
  roman(n) { const v = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [a, b] of v) while (n >= a) { s += b; n -= a; } return s; },

  // ---------- end of season / offseason ----------
  endSeason(L) {
    const rng = LG.rng(L);
    const tab = LG.table(L), me = tab[L.teamId];
    const P = L.playoffs;
    let result = 'Missed playoffs';
    if (P && P.seeds[0].concat(P.seeds[1]).includes(L.teamId)) {
      const lastGame = P.games.filter(g => g.h === L.teamId || g.a === L.teamId).pop();
      result = P.champion === L.teamId ? 'Won the Touchback Bowl' : 'Lost in the ' + LG.roundName(lastGame.round).toLowerCase() + ' round';
    }
    L.history.unshift({ year: L.year, w: me.w, l: me.l, result });
    const awards = LG.seasonAwards(L);
    // season records + career
    for (const p of L.roster) { LG.checkRecord(L, 'season', p, p.season); p.seasons.push({ year: L.year, ovr: p.ovr, team: LG.userTeam(L).abbr, ...compactStats(p.season) }); }
    // aging, decline, retirement
    const retired = [];
    for (const p of L.roster) {
      p.age++;
      if (p.age >= 30) for (const k of POS_ATTRS[p.pos]) p.attrs[k] = Math.round(clamp(p.attrs[k] - rng.range(0, p.age >= 33 ? 0.7 : 0.35), 1, 10) * 10) / 10;
      refreshPlayer(p);
      const retireP = p.age >= 37 ? 0.85 : p.age >= 34 ? 0.4 : p.age >= 32 ? 0.12 : 0;
      if (rng.chance(retireP)) retired.push(p);
    }
    for (const p of retired) LG.retire(L, p);
    for (const p of L.roster) { p.years--; p.season = blankStats(); }
    L.expiring = L.roster.filter(p => p.years <= 0).map(p => p.id);
    // the rest of the league ages, retires and re-signs too
    const ai = LG.aiOffseason(L, rng);
    LG.userTeam(L).lastW = me.w;
    const review = LG.ownerReview(L);
    L.phase = 'resign';
    LG.news(L, `Season ${L.year} complete: ${me.w}-${me.l}. ${result}.`);
    if (review.fired) {
      L.phase = 'fired'; L.offers = LG.jobOffers(L, rng);
      LG.news(L, `${L.coach.name} has been fired. Owner confidence fell to ${review.conf}%.`);
    } else LG.news(L, review.text + ` Owner confidence ${review.conf}%.`);
    LG.save(L);
    return { retired, result, awards, review, aiRetired: ai.retired.length };
  },
  retire(L, p) {
    L.roster = L.roster.filter(x => x !== p);
    const c = p.career;
    const hof = (p.peak >= 82 && p.seasons.length >= 4) || c.pyd >= 16000 || c.ryd >= 6500 || c.recyd >= 6500 || c.tkl >= 380 || c.sck >= 45 || c.dint >= 22 || c.fgm >= 170;
    LG.checkRecord(L, 'career', p, c);
    LG.news(L, `${shortName(p)} (${p.pos}) retires after ${p.seasons.length} season${p.seasons.length === 1 ? '' : 's'} with you.`);
    if (hof) { L.hof.push({ name: p.first + ' ' + p.last, pos: p.pos, year: L.year, peak: p.peak, line: LG.careerLine(p) }); LG.news(L, `${p.first} ${p.last} is inducted into the Hall of Fame!`); }
  },
  careerLine(p) {
    const c = p.career;
    return { QB: `${c.pyd} pass yds, ${c.ptd} TD`, RB: `${c.ryd} rush yds, ${c.rtd} TD`, WR: `${c.recyd} rec yds, ${c.rectd} TD`, TE: `${c.recyd} rec yds, ${c.rectd} TD`, OL: `${c.gp} games`, DL: `${c.sck} sacks, ${c.tkl} tkl`, LB: `${c.tkl} tkl, ${c.sck} sacks`, DB: `${c.dint} INT, ${c.tkl} tkl`, K: `${c.fgm}/${c.fga} FG` }[p.pos];
  },
  checkRecord(L, scope, p, s) {
    const keys = { pyd: 'Passing yards', ptd: 'Passing TDs', ryd: 'Rushing yards', rtd: 'Rushing TDs', recyd: 'Receiving yards', rectd: 'Receiving TDs', tkl: 'Tackles', sck: 'Sacks', dint: 'Interceptions', fgm: 'Field goals' };
    const R = L.records[scope];
    for (const k in keys) {
      const v = s[k] || 0;
      if (v > 0 && (!R[k] || v > R[k].v)) R[k] = { v, name: p.first + ' ' + p.last, year: L.year, label: keys[k] };
    }
  },
  askContract(p) {
    let s = salaryFor(p.ovr, p.age);
    if (p.morale < 40) s *= 1.25; else if (p.morale > 75) s *= 0.92;
    return { salary: Math.round(s * 10) / 10, years: p.age >= 31 ? 1 : p.age >= 28 ? 2 : 3, willing: p.morale >= 22 };
  },
  resign(L, pid, accept) {
    const p = L.roster.find(x => x.id === pid); if (!p) return;
    L.expiring = (L.expiring || []).filter(id => id !== pid);
    if (accept) {
      const a = LG.askContract(p);
      p.salary = a.salary; p.years = a.years; p.morale = clamp(p.morale + 8, 0, 100);
      LG.news(L, `Re-signed ${shortName(p)}: ${a.years} yrs at ${money(a.salary)}.`);
    } else {
      L.roster = L.roster.filter(x => x !== p); p.years = 1; L.fa.unshift(p);
      LG.news(L, `${shortName(p)} leaves as a free agent.`);
    }
    LG.save(L);
  },
  // ---------- draft ----------
  startDraft(L) {
    const rng = LG.rng(L);
    // order: worst record first, playoff teams by elimination round, champion last
    const tab = LG.table(L);
    const P = L.playoffs;
    const elim = {};
    if (P) for (const g of P.games) if (g.done) { const lost = g.hs > g.as ? g.a : g.h; elim[lost] = g.round + 1; }
    if (P && P.champion != null) elim[P.champion] = 9;
    const base = L.teams.map(t => t.id).sort((a, b) => {
      const ea = elim[a] || 0, eb = elim[b] || 0;
      if (ea !== eb) return ea - eb;
      const ra = tab[a], rb = tab[b];
      return (ra.w / Math.max(1, ra.w + ra.l)) - (rb.w / Math.max(1, rb.w + rb.l)) || (ra.pf - ra.pa) - (rb.pf - rb.pa);
    });
    const order = [];
    for (let r = 1; r <= 3; r++) for (const id of base) {
      const owned = L.picks.find(pk => pk.year === L.year && pk.round === r && pk.from === id);
      const traded = (L.tradedPicks || []).find(tp => tp.year === L.year && tp.round === r && tp.from === id);
      order.push({ round: r, from: id, owner: owned ? L.teamId : traded ? traded.to : (id === L.teamId ? -1 : id) });
    }
    const pool = [];
    const mix = ['QB', 'RB', 'WR', 'WR', 'TE', 'OL', 'OL', 'DL', 'DL', 'LB', 'LB', 'DB', 'DB', 'K'];
    for (let i = 0; i < 120; i++) {
      const pos = i < 2 ? 'QB' : rng.pick(mix), age = rng.int(21, 23);
      const q = clamp(rng.normal(4.3, 1.1) + (i < 12 ? 1.2 : 0), 2, 7.6);
      const p = genPlayer(rng, pos, q, age, { year: L.year + 1 });
      p.pot = Math.round(clamp(p.pot + rng.range(0, 1.2), q, 10) * 10) / 10;
      p.scout = 0; p.noise = rng.normal(0, 7);
      pool.push(p);
    }
    pool.sort((a, b) => (b.ovr + b.pot * 4) - (a.ovr + a.pot * 4));
    L.draft = { year: L.year, order, idx: 0, pool, made: [] };
    L.scoutPts = 6;
    L.phase = 'draft';
    LG.aiPicks(L);
    LG.save(L);
  },
  rookieSalary(round, idx) { return Math.round((round === 1 ? 4.2 - idx * 0.08 : round === 2 ? 1.4 : 0.8) * 10) / 10; },
  aiPicks(L) {
    const D = L.draft, rng = LG.rng(L);
    while (D.idx < D.order.length && D.order[D.idx].owner !== L.teamId) {
      const pick = D.order[D.idx];
      const best = D.pool.slice(0, 6);
      const p = rng.weighted(best, (x) => Math.pow(x.ovr + x.pot * 5, 2));
      D.pool = D.pool.filter(x => x !== p);
      D.made.push({ n: D.idx + 1, round: pick.round, team: pick.from, owner: pick.owner < 0 ? pick.from : pick.owner, name: shortName(p), pos: p.pos, ovr: p.ovr });
      const t = pick.owner >= 0 && pick.owner !== L.teamId ? L.teams[pick.owner] : null;
      p.salary = LG.rookieSalary(pick.round, D.idx % 32); p.years = pick.round === 1 ? 4 : 3;
      p.drafted = { year: D.year, round: pick.round, pick: D.idx + 1 }; p.joined = L.year + 1; p.rookie = L.year + 1; delete p.noise; p.scout = 2; p.morale = 70;
      if (t && t.roster) { t.roster.push(p); LG.fixNum(t.roster, p); LG.trimAI(L, t); } else L.fa.push(p);
      D.idx++;
    }
    if (D.idx >= D.order.length) L.draftDone = true;
  },
  userPick(L, pid) {
    const D = L.draft;
    if (!D || D.idx >= D.order.length || D.order[D.idx].owner !== L.teamId) return { ok: false, msg: 'Not your pick.' };
    if (L.roster.length >= ROSTER_MAX) return { ok: false, msg: `Roster full (${ROSTER_MAX}). Release a player first.` };
    const p = D.pool.find(x => x.id === pid); if (!p) return { ok: false, msg: 'Player already taken.' };
    const pick = D.order[D.idx];
    p.salary = LG.rookieSalary(pick.round, D.idx % 32); p.years = pick.round === 1 ? 4 : 3;
    if (p.salary > LG.capSpace(L)) return { ok: false, msg: 'Not enough cap space for his rookie deal.' };
    D.pool = D.pool.filter(x => x !== p);
    p.drafted = { year: D.year, round: pick.round, pick: D.idx + 1 }; p.joined = L.year + 1; p.rookie = L.year + 1; delete p.noise; p.scout = 2;
    p.morale = 70;
    L.roster.push(p); LG.fixNum(L.roster, p);
    D.made.push({ n: D.idx + 1, round: pick.round, team: pick.from, owner: L.teamId, name: shortName(p), pos: p.pos, ovr: p.ovr, mine: true });
    LG.news(L, `Drafted ${p.first} ${p.last} (${p.pos}) with pick #${D.idx + 1}.`);
    D.idx++;
    LG.aiPicks(L);
    LG.save(L);
    return { ok: true, p };
  },
  skipPick(L) { const D = L.draft; if (D.order[D.idx] && D.order[D.idx].owner === L.teamId) { D.made.push({ n: D.idx + 1, round: D.order[D.idx].round, team: D.order[D.idx].from, owner: L.teamId, name: 'PASSED', pos: '-', ovr: 0, mine: true }); D.idx++; LG.aiPicks(L); LG.save(L); } },
  scout(L, pid) {
    const p = L.draft.pool.find(x => x.id === pid); if (!p || p.scout >= 2) return false;
    if (L.scoutPts > 0) L.scoutPts--; else if (L.coach.cc >= 1) L.coach.cc--; else return false;
    p.scout++; LG.save(L); return true;
  },
  prospectView(p) {
    const err = p.scout >= 2 ? 0 : p.scout === 1 ? 6 : 13;
    const est = clamp(Math.round(p.ovr + (p.noise || 0) * (err / 13)), 10, 99);
    return { lo: clamp(est - err, 10, 99), hi: clamp(est + err, 10, 99), pot: p.scout >= 2 ? starsFromOvr(p.pot * 10) : p.scout === 1 ? (p.pot >= 7 ? 'HIGH' : p.pot >= 5.5 ? 'MEDIUM' : 'LOW') : '?' };
  },
  // ---------- new season ----------
  startNewSeason(L) {
    const rng = LG.rng(L);
    L.year++; L.week = 0; L.phase = 'regular'; L.playoffs = null; L.draft = null; L.draftDone = false; L.expiring = [];
    for (let r = 1; r <= 3; r++) L.picks.push({ year: L.year, round: r, from: L.teamId });
    L.picks = L.picks.filter(pk => pk.year >= L.year);
    L.schedule = LG.genSchedule(L.teams, rng);
    for (const p of L.roster) { p.cond = 100; p.morale = clamp(p.morale + 5, 0, 100); if (p.inj && p.inj.weeks > 3) p.inj.weeks = 1; else p.inj = null; }
    L.tradedPicks = (L.tradedPicks || []).filter(tp => tp.year >= L.year);
    LG.aiFreeAgency(L, rng);
    LG.aiCalibrate(L, rng);
    const keep = L.fa.filter(p => p.age < 34).slice(0, 14);
    for (const p of keep) { p.age++; refreshPlayer(p); }
    L.fa = LG.genFreeAgents(L, rng, 22).concat(keep).sort((a, b) => b.ovr - a.ovr);
    L.event = null;
    LG.backfillRatings(L);
    LG.setGoal(L);
    LG.news(L, `Season ${L.year} begins. Owner's goal: ${L.owner.goal.text.toLowerCase()}.`);
    LG.save(L);
  },
  // ---------- transactions ----------
  sign(L, pid) {
    const p = L.fa.find(x => x.id === pid); if (!p) return { ok: false, msg: 'Player not available.' };
    if (L.roster.length >= ROSTER_MAX) return { ok: false, msg: `Roster full (${ROSTER_MAX}). Release someone first.` };
    if (p.salary > LG.capSpace(L)) return { ok: false, msg: `Not enough cap space: he asks ${money(p.salary)}, you have ${money(LG.capSpace(L))}.` };
    L.fa = L.fa.filter(x => x !== p); p.morale = Math.max(p.morale, 65); p.cond = Math.max(p.cond, 90); p.joined = L.year;
    L.roster.push(p); LG.fixNum(L.roster, p);
    LG.news(L, `Signed ${p.first} ${p.last} (${p.pos}), ${p.years} yr${p.years > 1 ? 's' : ''} at ${money(p.salary)}.`);
    LG.backfillRatings(L); LG.save(L);
    return { ok: true };
  },
  release(L, pid) {
    const p = L.roster.find(x => x.id === pid); if (!p) return;
    L.roster = L.roster.filter(x => x !== p);
    p.morale = 50; L.fa.push(p); L.fa.sort((a, b) => b.ovr - a.ovr);
    LG.news(L, `Released ${p.first} ${p.last} (${p.pos}).`);
    LG.backfillRatings(L); LG.save(L);
  },
  tradeValue(L, p) {
    const v = p.ovr - Math.max(0, p.age - 27) * 2.2 + Math.max(0, 25 - p.age) * 1.5 + (p.pot - p.ovr / 10) * 2;
    const round = v >= 74 ? 1 : v >= 58 ? 2 : v >= 46 ? 3 : 0;
    return { v, round };
  },
  canTrade(L) { return L.phase !== 'regular' || L.week < TRADE_DEADLINE; },
  trade(L, pid) {
    const p = L.roster.find(x => x.id === pid); if (!p) return { ok: false };
    if (!LG.canTrade(L)) return { ok: false, msg: 'The trade deadline has passed.' };
    const tv = LG.tradeValue(L, p);
    if (!tv.round) return { ok: false, msg: 'No team will give up a pick for him.' };
    const rng = LG.rng(L);
    const partners = L.teams.filter(t => t.id !== L.teamId);
    const partner = rng.pick(partners);
    const year = L.phase === 'regular' || L.phase === 'playoffs' ? L.year : L.year + 1;
    L.roster = L.roster.filter(x => x !== p);
    if (partner.roster) { partner.roster.push(p); LG.fixNum(partner.roster, p); LG.trimAI(L, partner); LG.rateTeam(partner); }
    L.picks.push({ year, round: tv.round, from: partner.id });
    LG.news(L, `Traded ${p.first} ${p.last} to ${partner.city} for a round ${tv.round} pick.`);
    LG.backfillRatings(L); LG.save(L);
    return { ok: true, round: tv.round, partner };
  },
  upgradeCost(level) { return (level + 1) * 10; },
  upgrade(L, kind, key) {
    const cur = kind === 'staff' ? L.staff[key] : L.fac[key];
    if (cur >= 5) return { ok: false, msg: 'Already at the top level.' };
    const cost = LG.upgradeCost(cur);
    if (L.coach.cc < cost) return { ok: false, msg: `Needs ${cost} coaching credits.` };
    L.coach.cc -= cost;
    if (kind === 'staff') L.staff[key]++; else L.fac[key]++;
    if (key === 'stadium') L.fans = clamp(L.fans + 6, 0, 100);
    LG.save(L);
    return { ok: true };
  },
  boostMorale(L, pid) {
    const p = L.roster.find(x => x.id === pid); if (!p || L.coach.cc < 3) return false;
    L.coach.cc -= 3; p.morale = clamp(p.morale + 25, 0, 100); LG.save(L); return true;
  },
  // ---------- persistence ----------
  save(L) { if (!L) return false; L.savedAt = Date.now(); return Store.set(SAVE_KEY, L); },
  load() { const L = Store.get(SAVE_KEY); return L && L.v === 1 ? L : null; },
  clear() { Store.del(SAVE_KEY); },
};


// ==== franchise.js ====
// ---------- franchise depth: league-wide rosters, trades, awards, leaders, job security, identity, save slots ----------
// Every AI team carries a real roster of named players. Ratings come from those players, stats are credited
// to them in every simulated game, and they age, retire, re-sign, get drafted and change teams.
const AI_PLAN = [['QB', 0.3], ['RB', 0], ['WR', 0.2], ['WR', -0.4], ['TE', -0.3], ['OL', 0], ['OL', -0.3],
  ['DL', 0.1], ['DL', -0.2], ['DL', -0.5], ['LB', 0], ['LB', -0.4], ['DB', 0.1], ['DB', -0.3], ['K', 0]];
const AI_PLAN_COUNT = AI_PLAN.reduce((o, [p]) => (o[p] = (o[p] || 0) + 1, o), {});
const AI_ROSTER_MAX = 18;
const OFF_POS = ['QB', 'RB', 'WR', 'TE', 'OL'], DEF_POS = ['DL', 'LB', 'DB'];
const SAVE_SLOTS = ['touchback.save.v1', 'touchback.save.v1.slot2', 'touchback.save.v1.slot3'];
const SLOT_PREF = 'touchback.slot';
const LEADER_KEYS = [['pyd', 'Passing yards'], ['ptd', 'Passing TDs'], ['ryd', 'Rushing yards'], ['rtd', 'Rushing TDs'], ['recyd', 'Receiving yards'], ['rectd', 'Receiving TDs'], ['tkl', 'Tackles'], ['sck', 'Sacks'], ['dint', 'Interceptions'], ['fgm', 'Field goals']];
const AWARD_NAMES = { mvp: 'Most Valuable Player', opoy: 'Offensive Player of the Year', dpoy: 'Defensive Player of the Year', roy: 'Rookie of the Year', coy: 'Coach of the Year' };
const AWARD_SHORT = { mvp: 'MVP', opoy: 'OPOY', dpoy: 'DPOY', roy: 'ROY', allpro: 'ALL-PRO' };
const ALL_PRO_SLOTS = [['QB', 1], ['RB', 1], ['WR', 2], ['TE', 1], ['OL', 2], ['DL', 2], ['LB', 1], ['DB', 2], ['K', 1]];
const TEAM_SWATCHES = ['#1f3a6e', '#2453c9', '#7fb3e0', '#0b2533', '#11a3a8', '#00838f', '#0f6b5c', '#1b5e20', '#2e7d32', '#5a2d1a', '#4e342e', '#8a1c1c', '#b71c1c', '#d4462b', '#bf360c', '#f57f17', '#fdd835', '#e6c35c', '#c2185b', '#5b2a86', '#4a148c', '#2b2b2b', '#555c66', '#cfd8dc', '#f2f2f2', '#e8c070'];

function offScore(s) { return (s.pyd || 0) * 0.04 + (s.ptd || 0) * 4 - (s.pint || 0) * 2 + (s.ryd || 0) * 0.1 + (s.rtd || 0) * 6 + (s.recyd || 0) * 0.1 + (s.rectd || 0) * 6; }
function defScore(s) { return (s.tkl || 0) + (s.sck || 0) * 4 + (s.dint || 0) * 5; }
function statLineFor(pos, o) {
  o = Object.assign(blankStats(), o || {});
  return { QB: `${o.cmp}/${o.att} · ${o.pyd} yds · ${o.ptd} TD · ${o.pint} INT`, RB: `${o.car} car · ${o.ryd} yds · ${o.rtd} TD · ${o.rec} rec`, WR: `${o.rec} rec · ${o.recyd} yds · ${o.rectd} TD`, TE: `${o.rec} rec · ${o.recyd} yds · ${o.rectd} TD`, OL: `${o.gp} games`, DL: `${o.tkl} tkl · ${o.sck} sacks`, LB: `${o.tkl} tkl · ${o.sck} sacks · ${o.dint} INT`, DB: `${o.tkl} tkl · ${o.dint} INT`, K: `${o.fgm}/${o.fga} FG · ${o.xpm}/${o.xpa} XP` }[pos];
}
function compactStats(s) { const o = {}; for (const k in s) if (s[k]) o[k] = s[k]; return o; }
function coachName(rng) { const n = genName(rng); return n.first + ' ' + n.last; }

Object.assign(LG, {
  // ---------- rosters everywhere ----------
  rosterOf(L, id) { return id === L.teamId ? L.roster : (L.teams[id].roster || []); },
  allPlayers(L) { const out = []; for (const t of L.teams) for (const p of LG.rosterOf(L, t.id)) out.push({ p, t }); return out; },
  findPlayer(L, pid) {
    for (const t of L.teams) { const p = LG.rosterOf(L, t.id).find(x => x.id === pid); if (p) return { p, t }; }
    const f = L.fa.find(x => x.id === pid); if (f) return { p: f, t: null };
    const d = L.draft && L.draft.pool.find(x => x.id === pid); return d ? { p: d, t: null, prospect: true } : null;
  },
  teamRatings(roster) { return lineupRatings(buildLineup(roster, 1)); },
  rateTeam(t) { const r = LG.teamRatings(t.roster || []); t.off = r.off; t.def = r.def; t.kick = r.kick; return r; },
  genAIRoster(L, t, rng) {
    const taken = new Set(), roster = [];
    const oq = t.off / 10 + 0.7, dq = t.def / 10 + 0.9; // replacement players dilute a lineup, so starters sit above the team rating
    for (const [pos, off] of AI_PLAN) {
      const q = pos === 'K' ? (t.kick || 6) : (OFF_POS.includes(pos) ? oq : dq) + off;
      const p = genPlayer(rng, pos, clamp(q, 2, 9.6), rng.int(22, 32), { taken, year: L.year });
      p.years = rng.int(1, 4); p.morale = rng.int(55, 85);
      roster.push(p);
    }
    t.roster = roster;
    LG.calibrate(t, t.off, t.def);
    return roster;
  },
  // nudge a team's players until its lineup rates at the target (keeps the league in balance year to year)
  calibrate(t, offT, defT) {
    offT = clamp(offT, 40, 86); defT = clamp(defT, 40, 86);
    for (let it = 0; it < 8; it++) {
      const r = LG.teamRatings(t.roster);
      const dO = offT - r.off, dD = defT - r.def;
      if (Math.abs(dO) < 0.8 && Math.abs(dD) < 0.8) break;
      for (const p of t.roster) {
        const d = OFF_POS.includes(p.pos) ? dO * 0.13 : DEF_POS.includes(p.pos) ? dD * 0.15 : 0;
        if (!d) continue;
        for (const k of POS_ATTRS[p.pos]) p.attrs[k] = Math.round(clamp(p.attrs[k] + d, 1, 10) * 10) / 10;
        const avg = POS_ATTRS[p.pos].reduce((s, k) => s + p.attrs[k], 0) / POS_ATTRS[p.pos].length;
        p.pot = Math.round(clamp(Math.max(p.pot, avg), 1, 10) * 10) / 10;
        refreshPlayer(p);
      }
    }
    for (const p of t.roster) p.salary = Math.max(p.salary, 0.6);
    LG.rateTeam(t);
  },
  aiTeams(L) { return L.teams.filter(t => t.id !== L.teamId); },
  // a newcomer keeps his number unless a teammate already wears it
  fixNum(roster, p) {
    if (!roster.some(x => x !== p && x.num === p.num)) return;
    const taken = new Set(roster.filter(x => x !== p).map(x => x.num));
    p.num = jerseyNum(new RNG((p.id.length * 7919 + p.age * 31 + taken.size) | 0), p.pos, taken);
  },

  // ---------- saves: three slots, v1 saves migrate in place ----------
  slot: (() => { const v = Store.get(SLOT_PREF, 0) | 0; return v >= 0 && v < SAVE_SLOTS.length ? v : 0; })(),
  setSlot(i) { LG.slot = clamp(i | 0, 0, SAVE_SLOTS.length - 1); Store.set(SLOT_PREF, LG.slot); },
  save(L) {
    if (!L) return false;
    L.savedAt = Date.now();
    if (L.slot == null) L.slot = LG.slot;
    let ok = false;
    try { localStorage.setItem(SAVE_SLOTS[L.slot], JSON.stringify(L, (k, v) => (k === 'season' || k === 'career') && v && typeof v === 'object' ? compactStats(v) : v)); ok = true; } catch (e) { ok = false; }
    if (!ok && typeof UI !== 'undefined' && UI.toast) UI.toast('COULD NOT SAVE: DEVICE STORAGE IS FULL', 3000);
    return ok;
  },
  load(slot = LG.slot) {
    const L = Store.get(SAVE_SLOTS[slot]);
    if (!L || !L.teams || (L.v !== 1 && L.v !== 2)) return null;
    L.slot = slot;
    LG.migrate(L);
    return L;
  },
  clear(slot = LG.slot) { Store.del(SAVE_SLOTS[slot]); },
  slotSummary(i) {
    const L = Store.get(SAVE_SLOTS[i]);
    if (!L || !L.teams || !L.coach) return null;
    const t = L.teams[L.teamId];
    return { t, year: L.year, coach: L.coach.name, w: L.coach.wins, l: L.coach.losses, titles: L.coach.titles, savedAt: L.savedAt, phase: L.phase };
  },
  firstEmptySlot() { for (let i = 0; i < SAVE_SLOTS.length; i++) if (!LG.slotSummary(i)) return i; return -1; },
  migrate(L) {
    const rng = LG.rng(L);
    if (L.v === 1) {
      for (const t of LG.aiTeams(L)) {
        if (t.roster) continue;
        LG.genAIRoster(L, t, rng);
        if (t.stars) for (const pos in t.stars) { // keep the names the save already showed in play-by-play
          const s = t.stars[pos], p = t.roster.find(r => r.pos === pos);
          if (p) { const [f, ...l] = s.name.split(' '); p.first = f.replace('.', ''); p.last = l.join(' '); p.num = s.num; }
        }
      }
      L.v = 2;
    }
    for (const t of L.teams) if (!t.coach) t.coach = coachName(rng);
    L.owner = L.owner || { conf: 65, goal: null, history: [] };
    if (!L.owner.history) L.owner.history = [];
    if (!L.owner.goal) LG.setGoal(L);
    L.awards = L.awards || [];
    L.tradedPicks = L.tradedPicks || [];
    L.offers = L.offers || null;
    for (const { p } of LG.allPlayers(L)) { p.season = Object.assign(blankStats(), p.season); p.career = Object.assign(blankStats(), p.career); }
    for (const p of L.fa.concat(L.draft ? L.draft.pool : [])) { p.season = Object.assign(blankStats(), p.season); p.career = Object.assign(blankStats(), p.career); }
    return L;
  },

  // ---------- AI upkeep ----------
  aiWeek(L, rng) {
    for (const t of LG.aiTeams(L)) {
      for (const p of t.roster) {
        if (p.inj) { p.inj.weeks--; if (p.inj.weeks <= 0) p.inj = null; }
        LG.develop(p, rng, 1, 0.05);
      }
      LG.rateTeam(t);
    }
  },
  aiInjury(L, t, lineup, rng) {
    if (t.id === L.teamId || !rng.chance(0.2)) return;
    const pool = lineup.all.filter(p => !p.rep && p.pos !== 'K');
    if (!pool.length) return;
    const p = rng.pick(pool);
    p.inj = { weeks: rng.int(1, 4), type: rng.pick(['hamstring', 'ankle', 'knee', 'shoulder', 'concussion', 'wrist']) };
    if (p.ovr >= 75) LG.news(L, `${t.abbr}: ${shortName(p)} (${p.pos}) out ${p.inj.weeks} week${p.inj.weeks > 1 ? 's' : ''}.`);
  },
  credit(p, b) {
    for (const k in b) { p.season[k] = (p.season[k] || 0) + b[k]; p.career[k] = (p.career[k] || 0) + b[k]; }
  },
  aiOffseason(L, rng) {
    const out = { retired: [], released: [] }, tab = LG.table(L);
    for (const t of LG.aiTeams(L)) {
      t.prevOff = t.off; t.prevDef = t.def;
      const keep = [];
      for (const p of t.roster) {
        if (p.season.gp) { p.seasons.push({ year: L.year, ovr: p.ovr, team: t.abbr, ...compactStats(p.season) }); if (p.seasons.length > 10) p.seasons.shift(); }
        p.age++;
        if (p.age >= 30) for (const k of POS_ATTRS[p.pos]) p.attrs[k] = Math.round(clamp(p.attrs[k] - rng.range(0, p.age >= 33 ? 0.7 : 0.35), 1, 10) * 10) / 10;
        refreshPlayer(p);
        p.inj = null; p.cond = 100; p.season = blankStats();
        const retireP = p.age >= 37 ? 0.85 : p.age >= 34 ? 0.4 : p.age >= 32 ? 0.12 : 0;
        if (rng.chance(retireP)) { out.retired.push({ p, t }); if (p.peak >= 80) LG.news(L, `${t.abbr} star ${p.first} ${p.last} (${p.pos}) retires.`); continue; }
        p.years--;
        if (p.years <= 0) {
          const stay = p.ovr >= 55 && p.age <= 31 ? 0.75 : p.ovr >= 45 && p.age <= 29 ? 0.5 : 0.2;
          if (rng.chance(stay)) { p.years = rng.int(1, 3); p.salary = salaryFor(p.ovr, p.age); keep.push(p); }
          else { const a = LG.askContract(p); p.salary = a.salary; p.years = a.years; p.morale = 60; L.fa.push(p); out.released.push({ p, t }); }
        } else keep.push(p);
      }
      t.roster = keep;
      t.lastW = tab[t.id].w;
    }
    L.fa.sort((a, b) => b.ovr - a.ovr);
    return out;
  },
  aiFreeAgency(L, rng) {
    const signed = [];
    for (const t of rng.shuffle(LG.aiTeams(L))) {
      for (const pos of POSITIONS) {
        let have = t.roster.filter(p => p.pos === pos).length;
        while (have < AI_PLAN_COUNT[pos]) {
          const pool = L.fa.filter(p => p.pos === pos).sort((a, b) => b.ovr - a.ovr);
          if (!pool.length) break;
          const p = pool[Math.min(pool.length - 1, rng.int(0, 2))];
          L.fa = L.fa.filter(x => x !== p);
          p.years = rng.int(1, 3); p.joined = L.year; p.morale = Math.max(p.morale, 60);
          t.roster.push(p); LG.fixNum(t.roster, p); have++;
          signed.push({ p, t });
        }
      }
      LG.trimAI(L, t);
    }
    for (const { p, t } of signed.filter(x => x.p.ovr >= 70).slice(0, 4)) LG.news(L, `${t.abbr} sign free agent ${p.first} ${p.last} (${p.pos}).`);
    return signed;
  },
  trimAI(L, t) {
    while (t.roster.length > AI_ROSTER_MAX) {
      const worst = t.roster.slice().sort((a, b) => LG.tradeValue(L, a).v - LG.tradeValue(L, b).v)[0];
      t.roster = t.roster.filter(x => x !== worst); worst.morale = 50; L.fa.push(worst);
    }
  },
  aiCalibrate(L, rng) {
    for (const t of LG.aiTeams(L)) {
      const po = t.prevOff != null ? t.prevOff : t.off, pd = t.prevDef != null ? t.prevDef : t.def;
      const to = clamp(po + (61 - po) * 0.25 + rng.normal(0, 4.5), 42, 85), td = clamp(pd + (61 - pd) * 0.25 + rng.normal(0, 4.5), 42, 85);
      LG.calibrate(t, to, td);
    }
  },

  // ---------- league leaders + awards ----------
  leaders(L, key, n = 5) {
    return LG.allPlayers(L).filter(x => x.p.season[key] > 0).sort((a, b) => b.p.season[key] - a.p.season[key]).slice(0, n).map(x => ({ p: x.p, t: x.t, v: x.p.season[key] }));
  },
  seasonAwards(L) {
    const tab = LG.table(L), all = LG.allPlayers(L);
    const wp = (t) => { const r = tab[t.id]; return r.w / Math.max(1, r.w + r.l); };
    const best = (pool, score) => { let b = null, bs = 0; for (const x of pool) { const s = score(x); if (s > bs) { bs = s; b = x; } } return b; };
    const skill = all.filter(x => ['QB', 'RB', 'WR', 'TE'].includes(x.p.pos));
    const defenders = all.filter(x => DEF_POS.includes(x.p.pos));
    const entry = (x) => x && { pid: x.p.id, name: x.p.first + ' ' + x.p.last, pos: x.p.pos, team: x.t.abbr, tid: x.t.id, line: statLineFor(x.p.pos, x.p.season), mine: x.t.id === L.teamId };
    const mvp = best(skill, x => offScore(x.p.season) * (x.p.pos === 'QB' ? 1.08 : 1) + wp(x.t) * 70);
    const opoy = best(skill.filter(x => x !== mvp), x => offScore(x.p.season));
    const dpoy = best(defenders, x => defScore(x.p.season) + x.p.ovr * 0.05);
    const roy = best(all.filter(x => x.p.rookie === L.year), x => (OFF_POS.includes(x.p.pos) ? offScore(x.p.season) : defScore(x.p.season) * 1.7) + x.p.ovr * 0.2);
    const coyT = best(L.teams.map(t => ({ t })), ({ t }) => tab[t.id].w * 2 + (tab[t.id].w - (t.lastW != null ? t.lastW : 8)) * 3 + 40);
    const posScore = (x) => {
      const s = x.p.season, pos = x.p.pos;
      if (pos === 'OL') return x.p.ovr + wp(x.t) * 12 + (s.gp || 0) * 0.5;
      if (pos === 'K') return (s.fgm || 0) * 3 - ((s.fga || 0) - (s.fgm || 0)) * 2 + x.p.ovr * 0.1;
      if (DEF_POS.includes(pos)) return defScore(s) + x.p.ovr * 0.15;
      return offScore(s) + x.p.ovr * 0.05;
    };
    const allPro = [];
    for (const [pos, n] of ALL_PRO_SLOTS) allPro.push(...all.filter(x => x.p.pos === pos && (x.p.season.gp || 0) > 0).sort((a, b) => posScore(b) - posScore(a)).slice(0, n).map(entry));
    const rec = {
      year: L.year, mvp: entry(mvp), opoy: entry(opoy), dpoy: entry(dpoy), roy: entry(roy),
      coy: coyT ? { name: coyT.t.id === L.teamId ? L.coach.name : coyT.t.coach, team: coyT.t.abbr, tid: coyT.t.id, line: `${tab[coyT.t.id].w}-${tab[coyT.t.id].l}`, mine: coyT.t.id === L.teamId } : null,
      allPro,
    };
    const tag = (e, k) => { if (!e || !e.pid) return; const f = LG.findPlayer(L, e.pid); if (f) f.p.awards = (f.p.awards || []).concat(`Y${L.year} ${AWARD_SHORT[k]}`); };
    for (const k of ['mvp', 'opoy', 'dpoy', 'roy']) tag(rec[k], k);
    for (const e of allPro) tag(e, 'allpro');
    L.awards.unshift(rec); if (L.awards.length > 40) L.awards.length = 40;
    for (const k of ['mvp', 'opoy', 'dpoy', 'roy']) if (rec[k] && rec[k].mine) LG.news(L, `${rec[k].name} wins ${AWARD_NAMES[k]}!`);
    if (rec.mvp && !rec.mvp.mine) LG.news(L, `${rec.mvp.name} (${rec.mvp.team}) is the league MVP.`);
    if (rec.coy && rec.coy.mine) { L.coach.cc += 5; L.owner.conf = clamp(L.owner.conf + 5, 0, 100); LG.news(L, `${L.coach.name} is Coach of the Year! +5 coaching credits.`); }
    const mineAP = allPro.filter(e => e.mine).length;
    if (mineAP) LG.news(L, `${mineAP} of your players made the All-Pro team.`);
    return rec;
  },

  // ---------- job security ----------
  setGoal(L) {
    const me = LG.userTeam(L);
    const rank = L.teams.slice().sort((a, b) => (b.off + b.def) - (a.off + a.def)).indexOf(me) + 1;
    let g;
    if (L.year === 1 || rank > 24) g = { kind: 'wins', n: 6, text: 'Win at least 6 games' };
    else if (rank > 14) g = { kind: 'wins', n: 9, text: 'Finish with a winning record (9+ wins)' };
    else if (rank > 6) g = { kind: 'playoffs', text: 'Make the playoffs' };
    else g = { kind: 'round', n: 2, text: 'Reach the conference final' };
    L.owner.goal = g;
    return g;
  },
  ownerWeek(L, won, playoff) {
    const O = L.owner; if (!O) return;
    const before = O.conf;
    O.conf = clamp(O.conf + (playoff ? (won ? 4 : -1) : won ? 1.2 : -1.2), 0, 100);
    if (before >= 35 && O.conf < 35) LG.news(L, 'The owner is losing patience. Turn things around.');
  },
  ownerReview(L) {
    const O = L.owner, g = O.goal || LG.setGoal(L);
    const me = LG.table(L)[L.teamId], P = L.playoffs;
    const inP = !!(P && P.seeds[0].concat(P.seeds[1]).includes(L.teamId));
    const myGames = P ? P.games.filter(x => x.h === L.teamId || x.a === L.teamId) : [];
    const reached = !inP ? -1 : P.champion === L.teamId ? 4 : Math.max(0, ...myGames.map(x => x.round)); // round index the season ended in
    let met = g.kind === 'wins' ? me.w >= g.n : g.kind === 'playoffs' ? inP : reached >= g.n;
    let delta = met ? 14 : -16;
    if (!met && g.kind === 'wins' && me.w >= g.n - 1) delta = -8;
    if (!met && L.year === 1) delta = Math.max(delta, -8); // the owner knew year one was a rebuild
    if (inP) delta += 4;
    if (P && P.champion === L.teamId) delta += 22;
    delta += Math.round((L.fans - 50) / 8);
    O.conf = clamp(O.conf + delta, 0, 100);
    O.history.unshift({ year: L.year, goal: g.text, met, conf: Math.round(O.conf) });
    const champLast = L.champions[0] && L.champions[0].id === L.teamId && L.champions[0].year === L.year;
    const fired = L.year >= 2 && O.conf < 20 && !champLast;
    const text = met ? `The owner is pleased: "${g.text}" — done.` : `The owner is unhappy: the goal was "${g.text}".`;
    return { met, delta, conf: Math.round(O.conf), fired, text };
  },
  jobOffers(L, rng) {
    const pool = LG.aiTeams(L).sort((a, b) => (a.off + a.def) - (b.off + b.def)).slice(0, 10);
    return rng.shuffle(pool).slice(0, 3).map(t => t.id);
  },
  switchTeam(L, newId) {
    const oldId = L.teamId, old = L.teams[oldId], nt = L.teams[newId];
    old.roster = L.roster; old.coach = coachName(LG.rng(L));
    for (const p of old.roster) if (p.years <= 0) p.years = 1;
    LG.trimAI(L, old);
    L.roster = nt.roster || []; delete nt.roster;
    L.teamId = newId;
    // the new club's own picks for the coming draft come with the job; picks the old club acquired stay behind
    L.picks = [1, 2, 3].filter(r => !(L.tradedPicks || []).some(tp => tp.year === L.year && tp.round === r && tp.from === newId)).map(r => ({ year: L.year, round: r, from: newId }));
    L.staff = { oc: 0, dc: 0 }; L.fac = { stadium: 1, training: 1, rehab: 1 };
    L.fans = 45; L.owner = { conf: 55, goal: null, history: L.owner ? L.owner.history : [] };
    L.expiring = L.roster.filter(p => p.years <= 0).map(p => p.id);
    L.offers = null; L.event = null;
    LG.rateTeam(old); LG.backfillRatings(L);
    L.history.unshift({ year: L.year, w: 0, l: 0, result: `Hired by the ${nt.city} ${nt.name}`, note: true });
    LG.news(L, `${L.coach.name} is the new head coach of the ${nt.city} ${nt.name}.`);
    L.phase = 'resign';
    LG.setGoal(L);
    LG.save(L);
  },

  // ---------- trades ----------
  playerWorth(L, p) { return Math.pow(Math.max(0, LG.tradeValue(L, p).v - 28), 1.55); },
  pickWorth(round) { return Math.pow([0, 48, 31, 19][round] || 0, 1.55); },
  tradeEval(L, tid, mineIds, theirIds, pickIdx = []) {
    const T = L.teams[tid];
    if (!T || tid === L.teamId || !T.roster) return { ok: false, msg: 'Pick a team to trade with.', interest: 0 };
    const get = mineIds.map(id => L.roster.find(p => p.id === id)).filter(Boolean);
    const give = theirIds.map(id => T.roster.find(p => p.id === id)).filter(Boolean);
    const picks = pickIdx.map(i => L.picks[i]).filter(Boolean);
    if (!give.length) return { ok: false, msg: 'Choose at least one of their players.', interest: 0 };
    if (!get.length && !picks.length) return { ok: false, msg: 'Offer a player or a pick.', interest: 0 };
    if (!LG.canTrade(L)) return { ok: false, msg: 'The trade deadline has passed.', interest: 0 };
    const rosterAfter = L.roster.length - get.length + give.length;
    if (rosterAfter > ROSTER_MAX) return { ok: false, msg: `That would put you at ${rosterAfter} players (max ${ROSTER_MAX}).`, interest: 0 };
    const capAfter = LG.capUsed(L) - get.reduce((s, p) => s + p.salary, 0) + give.reduce((s, p) => s + p.salary, 0);
    if (capAfter > SALARY_CAP + 0.05 && capAfter > LG.capUsed(L)) return { ok: false, msg: `Their salaries would put you ${money(capAfter - SALARY_CAP)} over the cap.`, interest: 0 };
    if (T.roster.length - give.length + get.length > AI_ROSTER_MAX) return { ok: false, msg: `${T.abbr} has no roster room for that many players.`, interest: 0 };
    const countAfter = (pos) => T.roster.filter(p => p.pos === pos && !give.includes(p)).length + get.filter(p => p.pos === pos).length;
    const valIn = get.reduce((s, p) => s + LG.playerWorth(L, p) * (countAfter(p.pos) <= AI_PLAN_COUNT[p.pos] ? 1.18 : 0.9), 0) + picks.reduce((s, pk) => s + LG.pickWorth(pk.round), 0);
    const valOut = give.reduce((s, p) => s + LG.playerWorth(L, p) * (countAfter(p.pos) < AI_PLAN_COUNT[p.pos] ? 1.12 : 1), 0) + 1;
    const interest = valIn / valOut;
    const ok = interest >= 1.1;
    const msg = ok ? `${T.abbr} accept.` : interest >= 0.85 ? `${T.abbr} are close. Add a little more.` : interest >= 0.5 ? `${T.abbr} want a lot more for that.` : `${T.abbr} are not interested.`;
    return { ok, msg, interest, valIn, valOut, capAfter, rosterAfter };
  },
  executeTrade(L, tid, mineIds, theirIds, pickIdx = [], force = false) {
    const ev = LG.tradeEval(L, tid, mineIds, theirIds, pickIdx);
    if (!ev.ok && !(force && ev.interest > 0)) return ev;
    const T = L.teams[tid];
    const get = mineIds.map(id => L.roster.find(p => p.id === id)).filter(Boolean);
    const give = theirIds.map(id => T.roster.find(p => p.id === id)).filter(Boolean);
    const picks = pickIdx.map(i => L.picks[i]).filter(Boolean);
    L.roster = L.roster.filter(p => !get.includes(p)).concat(give);
    T.roster = T.roster.filter(p => !give.includes(p)).concat(get);
    for (const p of give) LG.fixNum(L.roster, p);
    for (const p of get) LG.fixNum(T.roster, p);
    for (const p of give) { p.joined = L.year; p.morale = clamp(p.morale + 4, 0, 100); }
    for (const pk of picks) { L.picks = L.picks.filter(x => x !== pk); L.tradedPicks.push({ year: pk.year, round: pk.round, from: pk.from, to: tid }); }
    const names = (arr) => arr.map(p => `${shortName(p)} (${p.pos})`).join(' and ');
    LG.news(L, `TRADE: ${names(give)} from ${T.abbr} for ${[names(get), ...picks.map(pk => `a Y${pk.year} round ${pk.round} pick`)].filter(Boolean).join(' and ')}.`);
    LG.rateTeam(T); LG.backfillRatings(L); LG.save(L);
    return { ok: true, msg: 'Trade complete.', give, get };
  },
  // an AI team calls with an offer (used by weekly events)
  makeTradeOffer(L, rng) {
    if (!LG.canTrade(L) || L.roster.length < 6) return null;
    const mine = L.roster.filter(p => !p.inj && p.ovr >= 50 && p.pos !== 'K');
    if (!mine.length) return null;
    const want = rng.pick(mine);
    for (let tries = 0; tries < 12; tries++) {
      const T = rng.pick(LG.aiTeams(L));
      const cands = T.roster.filter(p => p.pos !== want.pos && !p.inj && Math.abs(LG.playerWorth(L, p) - LG.playerWorth(L, want) * 0.95) < LG.playerWorth(L, want) * 0.3 + 30);
      if (!cands.length) continue;
      const offer = rng.pick(cands);
      const ev = LG.tradeEval(L, T.id, [want.id], [offer.id]);
      if (ev.interest < 0.9 || ev.capAfter > SALARY_CAP) continue;
      return { tid: T.id, mine: [want.id], theirs: [offer.id], text: `The ${T.city} ${T.name} offer ${offer.first} ${offer.last} (${offer.pos}, ${starsFromOvr(offer.ovr)}★, age ${offer.age}, ${money(offer.salary)}) for ${shortName(want)} (${want.pos}, ${starsFromOvr(want.ovr)}★, age ${want.age}).` };
    }
    return null;
  },

  // ---------- identity ----------
  setIdentity(L, o) {
    const t = LG.userTeam(L);
    const city = String(o.city || '').trim().slice(0, 16), name = String(o.name || '').trim().slice(0, 16);
    const abbr = String(o.abbr || '').trim().toUpperCase();
    if (!city || !name) return { ok: false, msg: 'City and nickname cannot be empty.' };
    if (!/^[A-Z]{2,3}$/.test(abbr)) return { ok: false, msg: 'Abbreviation must be 2 or 3 letters.' };
    if (L.teams.some(x => x !== t && x.abbr === abbr)) return { ok: false, msg: `${abbr} is already taken.` };
    const hex = /^#[0-9a-f]{6}$/i;
    const c1 = hex.test(o.c1) ? o.c1 : t.colors[0], c2 = hex.test(o.c2) ? o.c2 : t.colors[1];
    if (colorDist(c1, c2) < 40) return { ok: false, msg: 'Pick two colors that contrast more.' };
    Object.assign(t, { city, name, abbr, colors: [c1, c2] });
    LG.news(L, `The franchise unveils its new identity: the ${city} ${name}.`);
    LG.save(L);
    return { ok: true };
  },
  renamePlayer(L, pid, first, last, num) {
    const p = L.roster.find(x => x.id === pid); if (!p) return { ok: false, msg: 'Player not found.' };
    first = String(first || '').trim().slice(0, 14); last = String(last || '').trim().slice(0, 16);
    if (!first || !last) return { ok: false, msg: 'Enter a first and last name.' };
    const n = Math.round(Number(num));
    if (!(n >= 0 && n <= 99)) return { ok: false, msg: 'Jersey numbers run from 0 to 99.' };
    if (L.roster.some(x => x !== p && x.num === n)) return { ok: false, msg: `#${n} is already taken.` };
    p.first = first; p.last = last; p.num = n;
    LG.save(L);
    return { ok: true };
  },
});

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), (e) => { Sound.unlock(); Sound.blip(); v(e); });
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
